<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Field CRM (Salesforce-Style) – Single-File</title>

  <!-- Leaflet (Map) -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  />
  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>

  <style>
    :root{
      --bg:#0b1220;
      --panel:#101a33;
      --panel2:#0f1730;
      --card:#111f3e;
      --muted:#9bb0d1;
      --text:#e8f0ff;
      --accent:#4f8cff;
      --accent2:#22c55e;
      --warn:#f59e0b;
      --danger:#ef4444;
      --border:rgba(255,255,255,0.10);
      --shadow: 0 12px 30px rgba(0,0,0,.35);
      --radius:16px;
      --radius2:20px;
      --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      --sans: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji","Segoe UI Emoji";
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      font-family: var(--sans);
      background: radial-gradient(1200px 800px at 15% 0%, #0d1a3d 0%, var(--bg) 55%, #070c16 100%);
      color:var(--text);
      overflow:hidden;
    }
    a{color:inherit}
    .app{
      display:grid;
      grid-template-columns: 290px 1fr;
      height:100vh;
      gap:14px;
      padding:14px;
    }
    .sidebar{
      background: linear-gradient(180deg, rgba(79,140,255,.10), rgba(255,255,255,.02));
      border:1px solid var(--border);
      border-radius: var(--radius2);
      padding:14px;
      box-shadow: var(--shadow);
      display:flex;
      flex-direction:column;
      min-height:0;
    }
    .brand{
      display:flex;
      gap:10px;
      align-items:center;
      padding:10px 10px 16px;
      border-bottom:1px solid var(--border);
      margin-bottom:12px;
    }
    .logo{
      width:38px;height:38px;border-radius:12px;
      background: radial-gradient(circle at 30% 30%, #7fb0ff, #3b82f6 55%, #1e40af);
      box-shadow: 0 10px 18px rgba(79,140,255,.25);
    }
    .brand h1{
      font-size:14px;margin:0;line-height:1.2
    }
    .brand small{display:block;color:var(--muted);margin-top:4px}
    .nav{
      display:flex;
      flex-direction:column;
      gap:8px;
      padding:6px 4px;
      overflow:auto;
    }
    .nav button{
      border:1px solid var(--border);
      background: rgba(255,255,255,.03);
      color:var(--text);
      padding:10px 10px;
      border-radius: 14px;
      cursor:pointer;
      text-align:left;
      display:flex;
      justify-content:space-between;
      align-items:center;
      transition: all .15s ease;
    }
    .nav button:hover{transform: translateY(-1px); background: rgba(255,255,255,.06)}
    .nav button.active{
      background: rgba(79,140,255,.18);
      border-color: rgba(79,140,255,.35);
      box-shadow: 0 10px 24px rgba(79,140,255,.10);
    }
    .tag{
      font-size:11px;
      color:var(--muted);
      padding:3px 8px;
      border-radius:999px;
      border:1px solid var(--border);
      background: rgba(255,255,255,.02);
    }
    .footer{
      margin-top:auto;
      border-top:1px solid var(--border);
      padding-top:10px;
      display:grid;
      gap:8px;
    }
    .row{display:flex;gap:10px;align-items:center}
    .btn{
      border:1px solid var(--border);
      background: rgba(255,255,255,.04);
      color:var(--text);
      padding:9px 12px;
      border-radius: 14px;
      cursor:pointer;
      transition: all .15s ease;
      font-weight:600;
      font-size:13px;
    }
    .btn:hover{transform: translateY(-1px); background: rgba(255,255,255,.07)}
    .btn.primary{
      background: rgba(79,140,255,.22);
      border-color: rgba(79,140,255,.45);
    }
    .btn.good{
      background: rgba(34,197,94,.16);
      border-color: rgba(34,197,94,.35);
    }
    .btn.danger{
      background: rgba(239,68,68,.14);
      border-color: rgba(239,68,68,.35);
    }
    .btn.warn{
      background: rgba(245,158,11,.14);
      border-color: rgba(245,158,11,.35);
    }
    .content{
      background: rgba(255,255,255,.02);
      border:1px solid var(--border);
      border-radius: var(--radius2);
      box-shadow: var(--shadow);
      min-height:0;
      overflow:hidden;
      display:flex;
      flex-direction:column;
    }
    .topbar{
      display:flex;
      gap:10px;
      align-items:center;
      justify-content:space-between;
      padding:12px 14px;
      border-bottom:1px solid var(--border);
      background: linear-gradient(180deg, rgba(255,255,255,.03), rgba(255,255,255,.01));
    }
    .topbar h2{margin:0;font-size:15px}
    .topbar .search{
      display:flex; gap:10px; align-items:center; width:min(700px, 100%);
      justify-content:flex-end;
    }
    input, select, textarea{
      background: rgba(255,255,255,.04);
      border:1px solid var(--border);
      border-radius: 14px;
      padding:9px 10px;
      color:var(--text);
      outline:none;
      width:100%;
    }
    textarea{min-height:90px; resize:vertical}
    input::placeholder, textarea::placeholder{color: rgba(155,176,209,.70)}
    .grid{
      padding:14px;
      overflow:auto;
      min-height:0;
    }
    .cards{
      display:grid;
      grid-template-columns: repeat(12, 1fr);
      gap:12px;
    }
    .card{
      background: rgba(255,255,255,.03);
      border:1px solid var(--border);
      border-radius: var(--radius);
      padding:12px;
      box-shadow: 0 10px 22px rgba(0,0,0,.20);
    }
    .card h3{margin:0 0 8px;font-size:13px;color:var(--muted);font-weight:700}
    .kpi{
      font-size:26px;
      font-weight:800;
      letter-spacing:-.02em;
      margin:0 0 6px;
    }
    .sub{color:var(--muted);font-size:12px;margin:0}
    .span-3{grid-column: span 3;}
    .span-4{grid-column: span 4;}
    .span-5{grid-column: span 5;}
    .span-6{grid-column: span 6;}
    .span-7{grid-column: span 7;}
    .span-8{grid-column: span 8;}
    .span-9{grid-column: span 9;}
    .span-12{grid-column: span 12;}

    .table{
      width:100%;
      border-collapse: collapse;
      overflow:hidden;
      border-radius: 14px;
      border:1px solid var(--border);
      background: rgba(255,255,255,.02);
    }
    .table th, .table td{
      padding:10px 10px;
      border-bottom:1px solid var(--border);
      font-size:13px;
      vertical-align: top;
    }
    .table th{
      text-align:left;
      color:var(--muted);
      font-weight:800;
      font-size:12px;
      background: rgba(255,255,255,.03);
    }
    .table tr:hover td{background: rgba(79,140,255,.06)}
    .pill{
      display:inline-flex;align-items:center;gap:6px;
      border:1px solid var(--border);
      border-radius:999px;
      padding:4px 10px;
      font-size:12px;
      color:var(--muted);
      background: rgba(255,255,255,.02);
      white-space:nowrap;
    }
    .pill.good{border-color: rgba(34,197,94,.35); color:#b7f7cd; background: rgba(34,197,94,.10)}
    .pill.warn{border-color: rgba(245,158,11,.35); color:#ffe1b0; background: rgba(245,158,11,.10)}
    .pill.danger{border-color: rgba(239,68,68,.35); color:#ffc1c1; background: rgba(239,68,68,.10)}
    .split{
      display:grid;
      grid-template-columns: 1fr 1fr;
      gap:12px;
    }
    .formgrid{
      display:grid;
      grid-template-columns: repeat(12, 1fr);
      gap:10px;
    }
    .col-12{grid-column: span 12;}
    .col-8{grid-column: span 8;}
    .col-6{grid-column: span 6;}
    .col-4{grid-column: span 4;}
    .col-3{grid-column: span 3;}
    .help{color:var(--muted); font-size:12px; margin: 8px 0 0}
    .hr{height:1px; background: var(--border); margin:12px 0}

    /* Kanban */
    .kanban{
      display:grid;
      grid-template-columns: repeat(6, 1fr);
      gap:10px;
      align-items:start;
    }
    .col{
      border:1px solid var(--border);
      border-radius: 16px;
      background: rgba(255,255,255,.02);
      overflow:hidden;
      min-height: 220px;
    }
    .col header{
      padding:10px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      background: rgba(255,255,255,.03);
      border-bottom:1px solid var(--border);
    }
    .col header strong{font-size:12px;color:var(--muted)}
    .col .list{padding:10px; display:grid; gap:8px}
    .deal{
      border:1px solid var(--border);
      background: rgba(255,255,255,.03);
      border-radius: 14px;
      padding:10px;
      cursor:grab;
    }
    .deal:active{cursor:grabbing}
    .deal .t{font-weight:800; font-size:13px}
    .deal .m{color:var(--muted); font-size:12px; margin-top:6px}
    .deal .meta{display:flex; gap:8px; flex-wrap:wrap; margin-top:8px}

    /* Calendar */
    .calendar{
      border:1px solid var(--border);
      border-radius: 16px;
      overflow:hidden;
      background: rgba(255,255,255,.02);
    }
    .cal-head{
      display:flex; align-items:center; justify-content:space-between;
      padding:10px;
      background: rgba(255,255,255,.03);
      border-bottom:1px solid var(--border);
    }
    .cal-grid{
      display:grid;
      grid-template-columns: repeat(7, 1fr);
    }
    .dow{
      padding:8px 10px;
      border-bottom:1px solid var(--border);
      color:var(--muted);
      font-weight:800;
      font-size:12px;
      background: rgba(255,255,255,.02);
    }
    .day{
      min-height: 100px;
      border-right:1px solid var(--border);
      border-bottom:1px solid var(--border);
      padding:8px;
      display:flex;
      flex-direction:column;
      gap:6px;
    }
    .day:nth-child(7n){border-right:none}
    .day .n{
      color:var(--muted);
      font-size:12px;
      font-weight:800;
    }
    .evt{
      font-size:12px;
      padding:6px 8px;
      border-radius: 12px;
      border:1px solid rgba(79,140,255,.35);
      background: rgba(79,140,255,.12);
      cursor:pointer;
    }

    /* Map */
    #map{height: 460px; border-radius: 16px; overflow:hidden; border:1px solid var(--border)}

    /* Responsive */
    @media (max-width: 1100px){
      .app{grid-template-columns: 1fr;}
      body{overflow:auto}
      .content{height: calc(100vh - 28px)}
    }
    @media (max-width: 900px){
      .kanban{grid-template-columns: repeat(2, 1fr)}
      .split{grid-template-columns: 1fr}
    }
  </style>
</head>

<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="logo"></div>
      <div>
        <h1>Field CRM</h1>
        <small>Single-File • localStorage</small>
      </div>
    </div>

    <div class="nav" id="nav">
      <!-- buttons injected -->
    </div>

    <div class="footer">
      <div class="row">
        <button class="btn warn" id="btnExportAll">Export (JSON)</button>
        <button class="btn danger" id="btnReset">Reset</button>
      </div>
      <div class="help">
        Tipp: CSV-Import bei Kunden & Leads. Daten bleiben lokal im Browser.
      </div>
    </div>
  </aside>

  <main class="content">
    <div class="topbar">
      <h2 id="viewTitle">Dashboard</h2>
      <div class="search">
        <input id="globalSearch" placeholder="Suche (Name, Firma, E-Mail, Deal …)" />
        <button class="btn primary" id="btnQuickAdd">+ Schnell hinzufügen</button>
      </div>
    </div>

    <div class="grid" id="view"></div>
  </main>
</div>

<script>
/* =========================
   Utility / Storage Layer
========================= */
const Store = {
  key: "field_crm_v1",
  load(){
    const raw = localStorage.getItem(this.key);
    if(!raw) return null;
    try { return JSON.parse(raw); } catch { return null; }
  },
  save(state){
    localStorage.setItem(this.key, JSON.stringify(state));
  },
  reset(){
    localStorage.removeItem(this.key);
  }
};

const uid = () => Math.random().toString(16).slice(2) + "-" + Date.now().toString(16);

function moneyEUR(n){
  const v = Number(n || 0);
  return v.toLocaleString("de-DE", { style:"currency", currency:"EUR" });
}
function fmtDate(iso){
  if(!iso) return "";
  const d = new Date(iso);
  return d.toLocaleDateString("de-DE");
}
function fmtDT(iso){
  if(!iso) return "";
  const d = new Date(iso);
  return d.toLocaleString("de-DE", { dateStyle:"medium", timeStyle:"short" });
}
function todayISO(){
  const d = new Date();
  d.setHours(0,0,0,0);
  return d.toISOString();
}
function parseCSV(text){
  // Simple CSV parser: commas/semicolons supported, quotes supported minimally.
  const rows = [];
  const lines = text.replace(/\r/g,"").split("\n").filter(l=>l.trim().length);
  for(const line of lines){
    const sep = line.includes(";") && !line.includes(",") ? ";" : ",";
    const out = [];
    let cur="", inQ=false;
    for(let i=0;i<line.length;i++){
      const ch=line[i];
      if(ch === '"' ){ inQ = !inQ; continue; }
      if(ch===sep && !inQ){ out.push(cur.trim()); cur=""; continue; }
      cur += ch;
    }
    out.push(cur.trim());
    rows.push(out);
  }
  return rows;
}
function download(filename, content, mime="application/json"){
  const blob = new Blob([content], {type:mime});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

/* =========================
   Data Model
========================= */
const defaultState = () => ({
  me: { name: "Außendienst", region: "DE", currency:"EUR" },
  customers: [
    {id:uid(), name:"Müller GmbH", type:"B2B", email:"info@mueller.de", phone:"+49 30 123", city:"Berlin", address:"Musterstraße 10", status:"Aktiv", lastVisit: todayISO(), notes:"Key Account", tags:["A-Kunde"]},
  ],
  leads: [
    {id:uid(), name:"Schmidt Handel", source:"Website", email:"kontakt@schmidt.de", phone:"+49 40 555", city:"Hamburg", address:"Hafenweg 3", stage:"Neu", notes:"Interesse an Produkt X", tags:["Lead"]},
  ],
  deals: [
    {id:uid(), title:"Müller GmbH – Jahresvertrag", accountId:null, leadId:null, value:24000, stage:"Angebot", closeDate: new Date(Date.now()+1000*60*60*24*30).toISOString(), probability:0.55, owner:"Außendienst", notes:"Preis noch verhandeln"},
  ],
  expenses: [
    {id:uid(), date: todayISO(), category:"Kraftstoff", amount:62.40, vat:19, project:"Müller GmbH", method:"Karte", notes:"Tankstelle A"},
  ],
  events: [
    {id:uid(), title:"Kundentermin Müller", start: new Date(Date.now()+1000*60*60*24).toISOString(), end: new Date(Date.now()+1000*60*60*26).toISOString(), location:"Berlin", relatedType:"customer", relatedId:null, notes:"Demo vorbereiten"},
  ],
  tours: [
    {id:uid(), date: todayISO(), name:"Tour Berlin", stops: [
      {id:uid(), label:"Müller GmbH", address:"Musterstraße 10, Berlin", lat:52.52, lon:13.405, eta:"09:30", notes:"Ansprechpartner: Frau X"},
      {id:uid(), label:"Kaltakquise – Gebiet Mitte", address:"Alexanderplatz, Berlin", lat:52.5219, lon:13.4132, eta:"11:30", notes:"Flyer & Angebot"}
    ]}
  ],
  settings: { homeLat:52.52, homeLon:13.405 }
});

let STATE = Store.load() || defaultState();

/* =========================
   Views / Navigation
========================= */
const Views = [
  { id:"dashboard", title:"Dashboard", tag:"KPIs" },
  { id:"customers", title:"Kunden", tag:"Accounts" },
  { id:"leads", title:"Nicht-Kunden", tag:"Leads" },
  { id:"pipeline", title:"Pipeline", tag:"Kanban" },
  { id:"expenses", title:"Spesen", tag:"Reisekosten" },
  { id:"calendar", title:"Kalender", tag:"Termine" },
  { id:"tour", title:"Tourplaner", tag:"Stops" },
  { id:"routes", title:"Routen", tag:"Map" },
];

let currentView = "dashboard";
let globalQuery = "";

/* =========================
   Rendering Helpers
========================= */
const el = (html) => {
  const t = document.createElement("template");
  t.innerHTML = html.trim();
  return t.content.firstChild;
};

function setView(id){
  currentView = id;
  document.getElementById("viewTitle").textContent = Views.find(v=>v.id===id)?.title || "CRM";
  document.querySelectorAll("#nav button").forEach(b=>{
    b.classList.toggle("active", b.dataset.view === id);
  });
  render();
}

function save(){ Store.save(STATE); }

function applySearch(items, fields){
  const q = (globalQuery || "").trim().toLowerCase();
  if(!q) return items;
  return items.filter(it => fields.some(f => String(it[f]||"").toLowerCase().includes(q)));
}

/* =========================
   Dashboard
========================= */
function renderDashboard(){
  const customers = applySearch(STATE.customers, ["name","email","phone","city","address","status"]);
  const leads = applySearch(STATE.leads, ["name","email","phone","city","address","stage"]);
  const deals = applySearch(STATE.deals, ["title","stage","owner","notes"]);
  const expenses = applySearch(STATE.expenses, ["category","project","method","notes"]);

  const openDeals = deals.filter(d=>!["Gewonnen","Verloren"].includes(d.stage));
  const wonDeals = deals.filter(d=>d.stage==="Gewonnen");
  const pipelineValue = openDeals.reduce((s,d)=>s+Number(d.value||0),0);
  const wonValue = wonDeals.reduce((s,d)=>s+Number(d.value||0),0);
  const mtdExpenses = (() => {
    const now = new Date();
    const m = now.getMonth(), y = now.getFullYear();
    return STATE.expenses
      .filter(e=>{
        const d = new Date(e.date);
        return d.getMonth()===m && d.getFullYear()===y;
      })
      .reduce((s,e)=>s+Number(e.amount||0),0);
  })();

  // Tiny SVG bars (no libs)
  const stageOrder = ["Neu","Qualifiziert","Angebot","Verhandlung","Gewonnen","Verloren"];
  const counts = stageOrder.map(s => deals.filter(d=>d.stage===s).length);
  const max = Math.max(1, ...counts);
  const bars = counts.map((c,i)=>{
    const h = Math.round((c/max)*42);
    return `<rect x="${i*22}" y="${50-h}" width="16" height="${h}" rx="3"></rect>`;
  }).join("");

  return `
  <div class="cards">
    <div class="card span-3">
      <h3>Kunden</h3>
      <div class="kpi">${customers.length}</div>
      <p class="sub">Accounts im System</p>
    </div>
    <div class="card span-3">
      <h3>Nicht-Kunden</h3>
      <div class="kpi">${leads.length}</div>
      <p class="sub">Leads / Prospects</p>
    </div>
    <div class="card span-3">
      <h3>Pipeline (offen)</h3>
      <div class="kpi">${moneyEUR(pipelineValue)}</div>
      <p class="sub">${openDeals.length} Deals offen</p>
    </div>
    <div class="card span-3">
      <h3>Gewonnen</h3>
      <div class="kpi">${moneyEUR(wonValue)}</div>
      <p class="sub">${wonDeals.length} Deals gewonnen</p>
    </div>

    <div class="card span-7">
      <h3>Pipeline-Verteilung (Deals pro Stage)</h3>
      <svg viewBox="0 0 140 58" width="100%" height="80" style="opacity:.95">
        ${bars}
      </svg>
      <div class="row" style="flex-wrap:wrap;gap:8px">
        ${stageOrder.map((s,i)=>`<span class="pill">${s}: <strong style="color:var(--text)">${counts[i]}</strong></span>`).join("")}
      </div>
    </div>

    <div class="card span-5">
      <h3>Spesen (Monat)</h3>
      <div class="kpi">${moneyEUR(mtdExpenses)}</div>
      <p class="sub">Summe aktueller Monat</p>
      <div class="hr"></div>
      <p class="sub">Tipp: Spesen → Export CSV für Buchhaltung.</p>
    </div>

    <div class="card span-12">
      <h3>Nächste Termine</h3>
      ${renderUpcomingEventsTable()}
    </div>
  </div>`;
}

function renderUpcomingEventsTable(){
  const now = Date.now();
  const upcoming = [...STATE.events]
    .filter(e => new Date(e.start).getTime() >= now - 1000*60*60*2)
    .sort((a,b)=> new Date(a.start)-new Date(b.start))
    .slice(0,8);

  if(upcoming.length===0){
    return `<p class="sub">Keine Termine vorhanden.</p>`;
  }
  const rows = upcoming.map(e => `
    <tr>
      <td>${fmtDT(e.start)}</td>
      <td><strong>${escapeHtml(e.title)}</strong><div class="sub">${escapeHtml(e.location||"")}</div></td>
      <td>${escapeHtml(e.notes||"")}</td>
    </tr>
  `).join("");

  return `
    <table class="table">
      <thead><tr><th>Start</th><th>Termin</th><th>Notizen</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
  `;
}

/* =========================
   Customers / Leads
========================= */
function escapeHtml(s){
  return String(s||"")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function renderCustomers(){
  const items = applySearch(STATE.customers, ["name","email","phone","city","address","status","notes"]);
  return `
  <div class="cards">
    <div class="card span-12">

   Calendar
========================= */
function renderCalendar(){
  const base = calendarState.base || new Date();
  const y = base.getFullYear();
  const m = base.getMonth();

  const first = new Date(y, m, 1);
  const startDow = (first.getDay()+6)%7; // Monday=0
  const daysInMonth = new Date(y, m+1, 0).getDate();

  // build cells (6 weeks)
  const cells = [];
  for(let i=0;i<42;i++){
    const dayNum = i - startDow + 1;
    const inMonth = dayNum >= 1 && dayNum <= daysInMonth;
    const date = new Date(y, m, Math.max(1, Math.min(daysInMonth, dayNum)));
    const isoDay = new Date(y, m, dayNum).toISOString();
    const dayKey = isoDay.slice(0,10);

    const evts = inMonth ? STATE.events.filter(e => e.start.slice(0,10)===dayKey) : [];
    cells.push({inMonth, dayNum, dayKey, evts});
  }

  const monthName = new Date(y,m,1).toLocaleDateString("de-DE", {month:"long", year:"numeric"});

  return `
  <div class="cards">
    <div class="card span-5">
      <h3>Neuer Termin</h3>
      ${eventForm()}
    </div>
    <div class="card span-7">
      <div class="calendar">
        <div class="cal-head">
          <div class="row" style="gap:8px">
            <button class="btn" id="calPrev">←</button>
            <button class="btn" id="calToday">Heute</button>
            <button class="btn" id="calNext">→</button>
          </div>
          <strong>${monthName}</strong>
          <div class="tag">${STATE.events.length} Events</div>
        </div>

        <div class="cal-grid">
          ${["Mo","Di","Mi","Do","Fr","Sa","So"].map(d=>`<div class="dow">${d}</div>`).join("")}
          ${cells.map(c=>`
            <div class="day" style="opacity:${c.inMonth?1:0.35}">
              <div class="n">${c.inMonth ? c.dayNum : ""}</div>
              ${c.evts.slice(0,3).map(e=>`<div class="evt" data-act="editEvent" data-id="${e.id}" title="${escapeHtml(e.notes||"")}">${escapeHtml(e.title)}</div>`).join("")}
              ${c.evts.length>3?`<div class="sub">+${c.evts.length-3} mehr</div>`:""}
            </div>
          `).join("")}
        </div>
      </div>
      <p class="help">Klick auf Event → bearbeiten/löschen.</p>
    </div>

    <div class="card span-12">
      <h3>Terminliste</h3>
      ${eventsTable()}
    </div>
  </div>`;
}

function render(){
  const view = document.getElementById("view");
  if(currentView==="dashboard") view.innerHTML = renderDashboard();
  if(currentView==="customers") view.innerHTML = renderCustomers();
  if(currentView==="leads") view.innerHTML = renderLeads();

function wireNav(){

  nav.innerHTML = Views.map(v=>`

/* =========================
   Handlers (CRUD + Import/Export)
========================= */
function wireHandlers(){
  const root = document.getElementById("view");

  // Global delegated actions
  root.addEventListener("click", (e)=>{
    const a = e.target.closest("[data-act]");
    if(!a) return;
    const act = a.dataset.act;
    const id = a.dataset.id;

    if(act==="delCustomer"){
      STATE.customers = STATE.customers.filter(x=>x.id!==id); save(); render();
    }
    if(act==="editCustomer"){
      const c = STATE.customers.find(x=>x.id===id);
      openInlineEditor("Kunde bearbeiten", customerForm(c), (panel)=>{
        panel.querySelector("#cuSave").onclick = ()=> saveCustomer(c.id);
      });
    }

    if(act==="delLead"){
      STATE.leads = STATE.leads.filter(x=>x.id!==id); save(); render();
    }
    if(act==="editLead"){
      const l = STATE.leads.find(x=>x.id===id);
      openInlineEditor("Lead bearbeiten", leadForm(l), (panel)=>{
        panel.querySelector("#leSave").onclick = ()=> saveLead(l.id);
      });
    }
    if(act==="convertLead"){
      const l = STATE.leads.find(x=>x.id===id);
      if(!l) return;
      const c = {id:uid(), name:l.name, type:"B2B", email:l.email, phone:l.phone, city:l.city, address:l.address, status:"Aktiv", lastVisit:null, notes:l.notes, tags:[...(l.tags||[]), "Converted"]};
      STATE.customers.unshift(c);
      STATE.leads = STATE.leads.filter(x=>x.id!==id);
      save(); render();
    }

    if(act==="editDeal"){
      const d = STATE.deals.find(x=>x.id===id);
      openInlineEditor("Deal bearbeiten", dealForm(d), (panel)=>{
        panel.querySelector("#deSave").onclick = ()=> saveDeal(d.id);
      });
    }
    if(act==="delDeal"){
      STATE.deals = STATE.deals.filter(x=>x.id!==id); save(); render();
    }

    if(act==="editExpense"){
      const ex = STATE.expenses.find(x=>x.id===id);
      // Replace form in-place
      const card = root.querySelector(".card.span-8");
      if(card){
        card.innerHTML = `<h3>Spese bearbeiten</h3>` + expenseForm(ex);
        wireHandlers(); // rewire for new form buttons
      }
    }
    if(act==="delExpense"){
      STATE.expenses = STATE.expenses.filter(x=>x.id!==id); save(); render();
    }

    if(act==="editEvent"){
      const ev = STATE.events.find(x=>x.id===id);
      const leftCard = root.querySelector(".card.span-5");
      if(leftCard){
        leftCard.innerHTML = `<h3>Termin bearbeiten</h3>` + eventForm(ev);
        wireHandlers();
      }
    }

    if(act==="selectTour"){
      tourState.activeId = a.dataset.id; render();
    }
    if(act==="delStop"){
      const t = STATE.tours.find(x=>x.id===a.dataset.tour);
      if(!t) return;
      t.stops = t.stops.filter(s=>s.id!==a.dataset.id);
      save(); render();
    }
    if(act==="moveStopUp" || act==="moveStopDown"){
      const t = STATE.tours.find(x=>x.id===a.dataset.tour);
      if(!t) return;
      const idx = t.stops.findIndex(s=>s.id===a.dataset.id);
      const j = act==="moveStopUp" ? idx-1 : idx+1;
      if(idx<0 || j<0 || j>=t.stops.length) return;
      [t.stops[idx], t.stops[j]] = [t.stops[j], t.stops[idx]];
      save(); render();
    }

    if(act==="selectRouteTour"){
      routeState.activeId = a.dataset.id; render();
    }
  }, { once:true }); // re-wired every render

  // Customers
  const addCustomer = document.getElementById("addCustomer");
  if(addCustomer) addCustomer.onclick = ()=>{
    openInlineEditor("Neuer Kunde", customerForm(), (panel)=>{
      panel.querySelector("#cuSave").onclick = ()=> saveCustomer(null);
    });
  };
  const exportCustomers = document.getElementById("exportCustomers");

  const importCustomers = document.getElementById("importCustomers");

========================= */
function wireKanbanDnD(){
  const kanban = document.getElementById("kanban");
  if(!kanban) return;

  kanban.querySelectorAll(".deal").forEach(card=>{
    card.addEventListener("dragstart", (e)=>{
      e.dataTransfer.setData("text/plain", card.dataset.id);
    });
  });
  kanban.querySelectorAll(".col").forEach(col=>{
    col.addEventListener("dragover", (e)=> e.preventDefault());
    col.addEventListener("drop", (e)=>{
      e.preventDefault();
      const dealId = e.dataTransfer.getData("text/plain");
      const stage = col.dataset.stage;
      const d = STATE.deals.find(x=>x.id===dealId);
      if(!d) return;
      d.stage = stage;
      // quick default: probability move
      if(stage==="Gewonnen") d.probability = 1;
      if(stage==="Verloren") d.probability = 0;
      save(); render();
    });
  });
}

/* =========================
   Map / Routing
========================= */
function initMapIfNeeded(){
  if(map) { setTimeout(()=>map.invalidateSize(), 50); return; }
  map = L.map("map").setView([STATE.settings.homeLat, STATE.settings.homeLon], 11);
  mapLayer = L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 19,
    attribution: "&copy; OpenStreetMap"
  }).addTo(map);

  markersLayer = L.layerGroup().addTo(map);
  setTimeout(()=>map.invalidateSize(), 50);
}

function clearMapRoute(){
  if(markersLayer) markersLayer.clearLayers();
  if(routeLine){ routeLine.remove(); routeLine = null; }
  const info = document.getElementById("routeInfo");
  if(info) info.textContent = "";
}

function drawStopsOnMap(){
  initMapIfNeeded();
  clearMapRoute();

  const tours = [...STATE.tours].sort((a,b)=>new Date(a.date)-new Date(b.date));
  const t = tours.find(x=>x.id===routeState.activeId) || tours[0];
  if(!t){ return; }

  const coords = [];
  t.stops.forEach((s,i)=>{
    if(typeof s.lat==="number" && typeof s.lon==="number"){
      coords.push([s.lat, s.lon]);
      L.marker([s.lat, s.lon]).addTo(markersLayer)
        .bindPopup(`<strong>${i+1}. ${escapeHtml(s.label||"Stop")}</strong><br>${escapeHtml(s.address||"")}<br><span style="opacity:.8">${escapeHtml(s.eta||"")}</span>`);
    }
  });

  if(coords.length){
    const bounds = L.latLngBounds(coords);
    map.fitBounds(bounds.pad(0.25));
  }
  const info = document.getElementById("routeInfo");
  if(info) info.textContent = coords.length ? `Stops mit Koordinaten: ${coords.length}` : `Keine Stops mit Lat/Lon – bitte im Tourplaner pflegen.`;
}

// Uses OSRM demo server (public). For production: self-host OSRM / Mapbox / Google.
async function buildRouteOSRM(){
  initMapIfNeeded();
  clearMapRoute();

  const tours = [...STATE.tours].sort((a,b)=>new Date(a.date)-new Date(b.date));
  const t = tours.find(x=>x.id===routeState.activeId) || tours[0];
  if(!t) return;

  const pts = t.stops
    .filter(s=>typeof s.lat==="number" && typeof s.lon==="number")
    .map(s=>({lat:s.lat, lon:s.lon, label:s.label}));

  const info = document.getElementById("routeInfo");
  if(pts.length < 2){
    if(info) info.textContent = "Für Routing brauchst du mindestens 2 Stops mit Lat/Lon.";
    return;
  }

  // Draw markers
  pts.forEach((p,i)=>{
    L.marker([p.lat,p.lon]).addTo(markersLayer).bindPopup(`<strong>${i+1}. ${escapeHtml(p.label||"Stop")}</strong>`);
  });

  // OSRM expects lon,lat
  const coordStr = pts.map(p=>`${p.lon},${p.lat}`).join(";");
  const url = `https://router.project-osrm.org/route/v1/driving/${coordStr}?overview=full&geometries=geojson`;
  try{
    const res = await fetch(url);
    if(!res.ok) throw new Error("Routing fehlgeschlagen: " + res.status);
    const data = await res.json();
    const route = data.routes?.[0];
    if(!route) throw new Error("Keine Route erhalten.");
    const geo = route.geometry;

    routeLine = L.geoJSON(geo).addTo(map);
    map.fitBounds(routeLine.getBounds().pad(0.25));

    const km = (route.distance/1000);
    const mins = (route.duration/60);
    if(info) info.textContent = `Route: ${km.toFixed(1)} km • ${mins.toFixed(0)} min (OSRM Demo)`;
  }catch(err){
    if(info) info.textContent = `Hinweis: OSRM-Routing nicht erreichbar. (${err.message})`;
  }
}

/* =========================
   Inline Editor Panel
========================= */
function openInlineEditor(title, innerHtml, onReady){
  // reuse top of view area
  const view = document.getElementById("view");
  const panel = el(`
    <div class="cards">
      <div class="card span-12">
        <div class="row" style="justify-content:space-between;flex-wrap:wrap">
          <div>
            <h3 style="margin:0 0 6px">${escapeHtml(title)}</h3>
            <div class="sub">Speichern schreibt in localStorage.</div>
          </div>
          <button class="btn" id="closeEditor">Schließen</button>
        </div>
        <div class="hr"></div>
        ${innerHtml}
      </div>
    </div>
  `);
  view.innerHTML = "";
  view.appendChild(panel);

  panel.querySelector("#closeEditor").onclick = ()=> setView(currentView==="quickadd" ? "dashboard" : currentView);

  onReady?.(panel);

  // if form has save button ids, wire default
  const cuSave = panel.querySelector("#cuSave");
  if(cuSave && !cuSave.onclick) cuSave.onclick = ()=> saveCustomer(panel.querySelector("#customerForm")?.dataset.edit || null);
  const leSave = panel.querySelector("#leSave");
  if(leSave && !leSave.onclick) leSave.onclick = ()=> saveLead(panel.querySelector("#leadForm")?.dataset.edit || null);
  const deSave = panel.querySelector("#deSave");
  if(deSave && !deSave.onclick) deSave.onclick = ()=> saveDeal(panel.querySelector("#dealForm")?.dataset.edit || null);
}

/* =========================
   Save functions
========================= */
function saveCustomer(editId){
  const obj = {
    id: editId || uid(),
    name: document.getElementById("cuName").value.trim(),
    type: document.getElementById("cuType").value.trim(),
    status: document.getElementById("cuStatus").value.trim(),
    email: document.getElementById("cuEmail").value.trim(),
    phone: document.getElementById("cuPhone").value.trim(),
    city: document.getElementById("cuCity").value.trim(),
    address: document.getElementById("cuAddr").value.trim(),
    lastVisit: null,
    notes: document.getElementById("cuNotes").value.trim(),
    tags: document.getElementById("cuTags").value.split(",").map(x=>x.trim()).filter(Boolean)
  };
  if(editId){
    STATE.customers = STATE.customers.map(x=>x.id===editId ? obj : x);
  }else{
    STATE.customers.unshift(obj);
  }
  save();
  setView("customers");
}

function saveLead(editId){

function saveDeal(editId){
  const close = document.getElementById("deClose").value;
  const closeIso = new Date(close + "T00:00:00").toISOString();
  const obj = {
    id: editId || uid(),
    title: document.getElementById("deTitle").value.trim(),
    accountId: null,
    leadId: null,
    value: Number(document.getElementById("deValue").value || 0),
    stage: document.getElementById("deStage").value,
    closeDate: closeIso,
    probability: Math.max(0, Math.min(1, Number(document.getElementById("deProb").value || 0))),
    owner: document.getElementById("deOwner").value.trim(),
    notes: document.getElementById("deNotes").value.trim()
  };
  if(editId){
    STATE.deals = STATE.deals.map(x=>x.id===editId ? obj : x);
  }else{
    STATE.deals.unshift(obj);
  }
  save();
  setView("pipeline");
}

/* =========================
   CSV Export helper
========================= */
function toCSV(items, fields){
  const esc = (v)=>{
    const s = String(v ?? "");
    if(s.includes('"') || s.includes(",") || s.includes("\n") || s.includes(";")){
      return `"${s.replaceAll('"','""')}"`;
    }
    return s;
  };
  const head = fields.join(",");
  const rows = items.map(it=>{
    return fields.map(f=>{
      const v = Array.isArray(it[f]) ? it[f].join("|") : it[f];
      return esc(v);
    }).join(",");
  });
  return [head, ...rows].join("\n");
}
