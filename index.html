<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>CRM – macOS HIG Style</title>
<style>
/* macOS-inspired styling (HIG-aligned) */
:root{
  --accent: #0a84ff;
  --accent-fill: color-mix(in srgb, var(--accent) 18%, transparent);
  --text: #1d1d1f;
  --sub: #6e6e73;

  --bg: #f5f5f7;
  --window: rgba(255,255,255,0.72);
  --sidebar: rgba(246,246,247,0.85);
  --separator: rgba(0,0,0,0.10);
  --hairline: rgba(0,0,0,0.06);

  --radius-lg: 14px;
  --radius-md: 10px;

  --blur: saturate(180%) blur(20px);
  --shadow: 0 18px 45px rgba(0,0,0,0.12);

  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", system-ui, sans-serif;
  color-scheme: light dark;
}

@media (prefers-color-scheme: dark){
  :root{
    --text: #f5f5f7;
    --sub: #a1a1a6;

    --bg: #000;
    --window: rgba(28,28,30,0.72);
    --sidebar: rgba(44,44,46,0.75);
    --separator: rgba(255,255,255,0.14);
    --hairline: rgba(255,255,255,0.10);

    --shadow: 0 22px 55px rgba(0,0,0,0.55);
  }
}

*{ box-sizing:border-box; }
html,body{ height:100%; }
body{
  margin:0;
  background: radial-gradient(1200px 700px at 20% 0%, rgba(10,132,255,0.10), transparent 55%),
              radial-gradient(1000px 600px at 100% 10%, rgba(255,45,85,0.06), transparent 55%),
              var(--bg);
  color: var(--text);
}

.window{
  min-height: 100vh;
  display:flex;
  align-items: stretch;
  justify-content: center;
  padding: 22px;
}

.shell{
  width: min(1180px, 100%);
  display:grid;
  grid-template-columns: 280px 1fr;
  border-radius: var(--radius-lg);
  overflow:hidden;
  background: var(--window);
  backdrop-filter: var(--blur);
  box-shadow: var(--shadow);
  border: 1px solid var(--hairline);
}

/* Sidebar */
.sidebar{
  background: var(--sidebar);
  backdrop-filter: var(--blur);
  border-right: 1px solid var(--separator);
  padding: 14px 12px 14px 12px;
}

.sidebar .appname{
  display:flex;
  align-items:center;
  gap:10px;
  padding: 10px 10px 14px 10px;
  border-bottom: 1px solid var(--hairline);
  margin-bottom: 10px;
}
.badge{
  width: 28px; height: 28px;
  border-radius: 8px;
  display:grid; place-items:center;
  background: color-mix(in srgb, var(--accent) 22%, transparent);
  color: var(--accent);
  font-weight: 700;
}
.sidebar h1{
  font-size: 13px;
  letter-spacing: .2px;
  margin:0;
  font-weight: 600;
}

.nav{
  margin-top: 10px;
}
.nav .section{
  margin: 12px 0 6px;
  padding: 0 10px;
  font-size: 11px;
  color: var(--sub);
  letter-spacing: .3px;
  text-transform: uppercase;
}
.nav a{
  display:flex;
  align-items:center;
  gap:10px;
  padding: 9px 10px;
  border-radius: 10px;
  color: var(--text);
  text-decoration:none;
  user-select:none;
}
.nav a:hover{
  background: color-mix(in srgb, var(--text) 6%, transparent);
}
.nav a.active{
  background: var(--accent-fill);
  color: var(--accent);
}
.icon{
  width: 16px; height: 16px;
  display:inline-block;
}

/* Main area */
.main{
  display:flex;
  flex-direction:column;
  min-width: 0;
}

.toolbar{
  position: sticky;
  top: 0;
  z-index: 10;
  display:flex;
  align-items:center;
  gap: 12px;
  padding: 12px 16px;
  border-bottom: 1px solid var(--separator);
  background: color-mix(in srgb, var(--window) 86%, transparent);
  backdrop-filter: var(--blur);
}

.titleblock{
  display:flex;
  flex-direction:column;
  gap:2px;
  min-width: 0;
}
.titleblock .title{
  font-size: 15px;
  font-weight: 600;
  line-height: 1.2;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.titleblock .subtitle{
  font-size: 12px;
  color: var(--sub);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.spacer{ flex:1; }

.search{
  display:flex;
  align-items:center;
  gap: 8px;
  padding: 8px 10px;
  border-radius: 10px;
  border: 1px solid var(--hairline);
  background: color-mix(in srgb, var(--window) 72%, transparent);
  min-width: 260px;
}
.search input{
  border:0;
  outline:none;
  background: transparent;
  color: var(--text);
  width: 100%;
  font-size: 13px;
}
.search kbd{
  font-size: 11px;
  color: var(--sub);
  border: 1px solid var(--hairline);
  border-bottom-color: color-mix(in srgb, var(--hairline) 60%, transparent);
  border-radius: 6px;
  padding: 2px 6px;
}

.content{
  padding: 16px;
  min-width: 0;
}

/* Table/List (macOS-like) */
.table{
  border: 1px solid var(--hairline);
  border-radius: var(--radius-lg);
  overflow:hidden;
  background: color-mix(in srgb, var(--window) 78%, transparent);
}
.table .thead{
  display:grid;
  grid-template-columns: 1.2fr .8fr .8fr .6fr;
  gap: 0;
  padding: 10px 12px;
  font-size: 12px;
  color: var(--sub);
  border-bottom: 1px solid var(--hairline);
  background: color-mix(in srgb, var(--window) 90%, transparent);
}
.row{
  display:grid;
  grid-template-columns: 1.2fr .8fr .8fr .6fr;
  padding: 11px 12px;
  font-size: 13px;
  border-bottom: 1px solid var(--hairline);
}
.row:last-child{ border-bottom: 0; }
.row:hover{
  background: color-mix(in srgb, var(--text) 5%, transparent);
}
.cell.sub{ color: var(--sub); }
.pill{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  padding: 3px 10px;
  border-radius: 999px;
  border: 1px solid var(--hairline);
  background: color-mix(in srgb, var(--window) 80%, transparent);
  font-size: 12px;
}
.pill.blue{
  color: var(--accent);
  border-color: color-mix(in srgb, var(--accent) 40%, var(--hairline));
  background: color-mix(in srgb, var(--accent) 14%, transparent);
}

/* Focus */
:focus-visible{
  outline: 3px solid color-mix(in srgb, var(--accent) 55%, transparent);
  outline-offset: 2px;
  border-radius: 10px;
}

/* Responsive */
@media (max-width: 900px){
  .shell{ grid-template-columns: 1fr; }
  .sidebar{ display:none; }
  .search{ min-width: 0; width: 42vw; }
  .table .thead, .row{ grid-template-columns: 1.2fr .8fr .7fr; }
  .table .thead div:nth-child(4), .row div:nth-child(4){ display:none; }
}
</style>
</head>
<body>
<div class="window">
  <div class="shell" role="application" aria-label="CRM">
    <aside class="sidebar" aria-label="Navigation">
      <div class="appname">
        <div class="badge" aria-hidden="true">C</div>
        <h1>CRM</h1>
      </div>

      <div class="nav">
        <div class="section">Bereiche</div>

        <a class="active" href="#">
          <span class="icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 10.5 12 3l9 7.5V21a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1v-10.5z"/></svg>
          </span>
          Übersicht
        </a>

        <a href="#">
          <span class="icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          </span>
          Kontakte
        </a>

        <a href="#">
          <span class="icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 13V7a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v6"/><path d="M4 13h16l-1 8H5l-1-8z"/></svg>
          </span>
          Deals
        </a>

        <a href="#">
          <span class="icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 7V3h8v4"/><path d="M5 7h14a2 2 0 0 1 2 2v9a3 3 0 0 1-3 3H6a3 3 0 0 1-3-3V9a2 2 0 0 1 2-2z"/><path d="M9 13h6"/></svg>
          </span>
          Aktivitäten
        </a>

        <div class="section">System</div>
        <a href="#">
          <span class="icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7z"/><path d="M19.4 15a7.8 7.8 0 0 0 .1-2l2-1.5-2-3.5-2.4 1a7.7 7.7 0 0 0-1.7-1l-.3-2.6h-4l-.3 2.6a7.7 7.7 0 0 0-1.7 1l-2.4-1-2 3.5 2 1.5a7.8 7.8 0 0 0 .1 2l-2 1.5 2 3.5 2.4-1a7.7 7.7 0 0 0 1.7 1l.3 2.6h4l.3-2.6a7.7 7.7 0 0 0 1.7-1l2.4 1 2-3.5-2-1.5z"/></svg>
          </span>
          Einstellungen
        </a>
      </div>
    </aside>

    <main class="main" aria-label="Inhalt">
      <header class="toolbar">
        <div class="titleblock">
          <div class="title">Übersicht</div>
          <div class="subtitle">Leads, Umsatz und Aufgaben auf einen Blick</div>
        </div>
        <div class="spacer"></div>

        <label class="search" aria-label="Suchen">
          <span class="icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
          </span>
          <input type="search" placeholder="Suchen" />
          <kbd aria-hidden="true">⌘F</kbd>
        </label>
      </header>

      <div class="content">
        <div class="table" role="table" aria-label="Pipeline">
          <div class="thead" role="row">
            <div role="columnheader">Name</div>
            <div role="columnheader">Status</div>
            <div role="columnheader">Owner</div>
            <div role="columnheader">Wert</div>
          </div>

          <div class="row" role="row" tabindex="0">
            <div class="cell" role="cell">Acme GmbH – Einführung</div>
            <div class="cell" role="cell"><span class="pill blue">Aktiv</span></div>
            <div class="cell sub" role="cell">Max</div>
            <div class="cell" role="cell">€ 24k</div>
          </div>

          <div class="row" role="row" tabindex="0">
            <div class="cell" role="cell">Nordwind AG – Renewal</div>
            <div class="cell" role="cell"><span class="pill">Offen</span></div>
            <div class="cell sub" role="cell">Lea</div>
            <div class="cell" role="cell">€ 9k</div>
          </div>

          <div class="row" role="row" tabindex="0">
            <div class="cell" role="cell">Stadtwerke – Demo</div>
            <div class="cell" role="cell"><span class="pill">In Prüfung</span></div>
            <div class="cell sub" role="cell">Jonas</div>
            <div class="cell" role="cell">€ 14k</div>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>
</body>
</html>
