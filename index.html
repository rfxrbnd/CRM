<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AD Board v123 - Layout Fix</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <style>
        /* --- DESIGN CORE --- */
        :root {
            --brand: #fcd34d; 
            --brand-dark: #d97706; 
            --bg-body: #f8fafc;
            --bg-sidebar: #ffffff;
            --surface: #ffffff;
            --text-main: #0f172a;
            --text-light: #64748b;
            --border: #e2e8f0;
            --radius: 10px;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            --stat-green: #22c55e;
            --stat-yellow: #eab308;
            --stat-red: #ef4444;
            --event-blue: #dbeafe; 
            --event-blue-text: #1e40af;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif; margin: 0; display: flex; height: 100vh; background: var(--bg-body); color: var(--text-main); overflow: hidden; }

        #loader { position: fixed; top:0; left:0; right:0; bottom:0; background: rgba(255,255,255,0.98); z-index: 99999; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .spinner { width: 40px; height: 40px; border: 3px solid var(--border); border-top-color: var(--text-main); border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        #sidebar { width: 280px; background: var(--bg-sidebar); border-right: 1px solid var(--border); display: flex; flex-direction: column; z-index: 50; flex-shrink: 0; transition: transform 0.3s ease; }
        .logo-area { padding: 20px; text-align: center; border-bottom: 1px solid var(--border); background: #fff; }
        .logo-img { max-width: 100%; max-height: 60px; object-fit: contain; }
        
        .nav-menu { padding: 20px; display: flex; flex-direction: column; gap: 5px; flex: 1; overflow-y: auto; }
        .nav-item { display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: var(--radius); cursor: pointer; color: var(--text-light); font-size: 14px; font-weight: 500; transition: 0.1s; border: none; background: transparent; width: 100%; text-align: left; }
        .nav-item:hover { background: #f1f5f9; color: var(--text-main); }
        .nav-item.active { background: #fffbeb; color: var(--text-main); font-weight: 700; border: 1px solid var(--brand); }

        #main { flex: 1; overflow-y: auto; padding: 0; position: relative; }
        .content-wrap { max-width: 1000px; margin: 0 auto; padding: 30px; padding-bottom: 100px; }

        .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; margin-bottom: 20px; box-shadow: var(--shadow); }
        h1 { margin: 0 0 20px 0; font-size: 24px; font-weight: 800; display: flex; align-items: center; gap: 10px; }
        label { display: block; margin-bottom: 5px; font-size: 12px; font-weight: 700; color: var(--text-light); text-transform: uppercase; }
        input, select, textarea { width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: var(--radius); font-size: 14px; margin-bottom: 15px; font-family: inherit; background: #fff; }
        
        .btn { display: inline-flex; align-items: center; justify-content: center; padding: 10px 16px; border-radius: var(--radius); font-size: 13px; font-weight: 600; cursor: pointer; border: 1px solid var(--border); gap: 6px; text-decoration: none !important; transition: 0.1s; user-select: none; }
        .btn:active { transform: scale(0.98); }
        .btn-primary { background: #ffffff; color: var(--text-main); border-color: var(--border); }
        .btn-primary:hover { background: #f8fafc; border-color: #94a3b8; }
        .btn-secondary { background: #ffffff; border: 1px solid var(--border); color: var(--text-main); }
        .btn-secondary:hover { background: #f8fafc; }
        .btn-danger { background: #fff; color: #991b1b; border-color: #fee2e2; }
        .btn-success { background: #dcfce7; color: #166534; border-color: #bbf7d0; }
        .btn-full { width: 100%; }

        /* --- VISUAL CATEGORY BADGES --- */
        .cat-badge { padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 800; color: #fff; display: inline-block; min-width: 24px; text-align: center; }
        .cat-A { background-color: #f59e0b; color: #fff; } /* Gold */
        .cat-B { background-color: #3b82f6; color: #fff; } /* Blau */
        .cat-C { background-color: #94a3b8; color: #fff; } /* Grau */

        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
        .grid-4-custom { display: grid; grid-template-columns: 1.5fr 1.5fr 0.5fr 1fr; gap: 10px; align-items: end; }
        
        .cust-row { display: flex; align-items: center; padding: 14px; background: #fff; border-bottom: 1px solid var(--border); cursor: pointer; transition: 0.1s; justify-content: space-between; }
        .cust-row:hover { background: #f8fafc; }
        .cust-row.selected { background: #fffbeb; border-color: var(--brand); }
        .check-circle { width: 20px; height: 20px; border: 2px solid #cbd5e1; border-radius: 50%; margin-right: 15px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: 0.2s; }
        .cust-row.selected .check-circle { background: var(--brand); border-color: var(--brand-dark); }
        .cust-row.selected .check-circle::after { content: '✓'; font-size: 12px; font-weight: bold; color: #451a03; }
        
        .exp-row { display: flex; align-items: center; justify-content: space-between; padding: 15px; border-bottom: 1px solid #eee; background: #fff; }
        .exp-amount { font-weight: 800; color: var(--text-main); }
        .exp-cat { font-size: 10px; background: #e2e8f0; padding: 2px 6px; border-radius: 4px; color: #475569; font-weight: bold; margin-right: 5px; }
        .exp-img { max-height: 100px; border: 1px solid #eee; border-radius: 4px; margin-top: 5px; cursor: pointer; }

        .float-bar { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #fff; padding: 15px 25px; border-radius: 50px; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.2); border: 1px solid var(--border); display: flex; gap: 15px; align-items: center; z-index: 1000; animation: slideUp 0.3s; }
        @keyframes slideUp { from { transform: translate(-50%, 100%); } to { transform: translate(-50%, 0); } }

        .report-entry { padding: 15px; background: #f8fafc; border: 1px solid var(--border); border-radius: 8px; margin-bottom: 10px; border-left: 3px solid var(--brand); }
        .rep-img { max-width: 100%; height: auto; border-radius: 6px; margin-top: 10px; border: 1px solid #ddd; }
        
        .task-mini-row { display: flex; align-items: center; padding: 6px 0; border-bottom: 1px solid #eee; font-size: 13px; }
        .task-chk { margin-right: 8px; cursor: pointer; }
        .task-done { text-decoration: line-through; color: #999; }
        .task-date { font-size: 10px; background: #eee; padding: 1px 4px; border-radius: 4px; margin-left: 5px; white-space: nowrap; }
        .task-date.overdue { background: #fee2e2; color: #b91c1c; }
        .global-task-row { padding: 15px; border-bottom: 1px solid #eee; background: #fff; display: flex; align-items: flex-start; }

        .cal-layout { display: grid; grid-template-columns: 250px 1fr; gap: 20px; height: calc(100vh - 120px); min-height: 500px; }
        .cal-pool { background: #fff; border: 1px solid var(--border); border-radius: var(--radius); display: flex; flex-direction: column; overflow: hidden; }
        .cal-main { background: #fff; border: 1px solid var(--border); border-radius: var(--radius); display: flex; flex-direction: column; overflow: hidden; position: relative; }
        .pool-list { flex: 1; overflow-y: auto; padding: 10px; background: #f8fafc; }
        .pool-item { padding: 8px 10px; margin-bottom: 5px; background: #fff; border: 1px solid var(--border); border-radius: 6px; font-size: 12px; cursor: grab; display: flex; align-items: center; box-shadow: 0 1px 2px rgba(0,0,0,0.03); }
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); background: #e2e8f0; gap: 1px; flex: 1; overflow-y: auto; }
        .cal-head { background: #f1f5f9; padding: 10px; text-align: center; font-size: 11px; font-weight: 700; color: #64748b; }
        .cal-day { background: #ffffff; min-height: 100px; padding: 6px; font-size: 12px; display: flex; flex-direction: column; gap: 2px; }
        .cal-day.today { background: #fffbeb; }
        .cal-event { background: var(--brand); color: #451a03; padding: 4px 6px; border-radius: 4px; font-size: 10px; cursor: grab; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; border: 1px solid rgba(0,0,0,0.05); margin-top: 2px; }
        .cal-event.manual { background: var(--event-blue); color: var(--event-blue-text); border-color: #93c5fd; }

        .view-controls { display: flex; gap: 5px; }
        .view-btn { padding: 6px 12px; font-size: 12px; border: 1px solid var(--border); background: #fff; border-radius: 6px; cursor: pointer; }
        .view-btn.active { background: #fff; border-color: var(--text-main); font-weight: 700; color: var(--text-main); }

        .stat-container { display: flex; align-items: flex-end; height: 80px; gap: 5px; margin-top: 15px; }
        .stat-bar { flex: 1; background: var(--brand); border-radius: 4px 4px 0 0; position: relative; min-height: 2px; }
        .stat-val { position: absolute; top: -16px; width: 100%; text-align: center; font-size: 10px; font-weight: bold; }
        .stat-lbl { position: absolute; bottom: -18px; width: 100%; text-align: center; font-size: 9px; color: #666; }

        .modal-overlay { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.4); z-index: 2000; justify-content: center; align-items: center; }
        .modal-box { background: #fff; padding: 30px; border-radius: var(--radius); width: 90%; max-width: 350px; }
        #map-container { height: 600px; width: 100%; border-radius: var(--radius); border: 1px solid var(--border); z-index: 1; }

        #menu-toggle { display: none; position: fixed; top: 15px; right: 15px; z-index: 100; background: #fff; color: #000; border: 1px solid #ddd; width: 45px; height: 45px; border-radius: 50%; font-size: 24px; box-shadow: var(--shadow); }
        @media (max-width: 800px) {
            #sidebar { position: fixed; height: 100%; transform: translateX(-100%); width: 80%; box-shadow: 10px 0 30px rgba(0,0,0,0.2); }
            #sidebar.open { transform: translateX(0); }
            #menu-toggle { display: block; }
            .cal-layout { grid-template-columns: 1fr; display: flex; flex-direction: column; height: auto; }
            .cal-pool { height: 150px; margin-bottom: 20px; }
            .cal-main { height: 500px; }
            .grid-2, .grid-3, .grid-4-custom { grid-template-columns: 1fr; }
        }
        @media print {
            #sidebar, #menu-toggle, .no-print, .btn, .nav-menu, .del-x, .float-bar { display: none !important; }
            #main { padding: 0; margin: 0; width: 100%; height: auto; overflow: visible; }
            body { background: #fff; height: auto; overflow: visible; font-family: sans-serif; }
            .card { box-shadow: none; border: none; margin: 0; padding: 0; border-bottom: 1px solid #eee; margin-bottom: 20px; }
            h1 { font-size: 18pt; border-bottom: 2px solid #000; margin-bottom: 20px; }
            .report-row { border-bottom: 1px solid #ccc; padding: 10px 0; page-break-inside: avoid; }
            #rep-input-area, textarea { display: none; }
        }
    </style>

    <!-- External libs (defer) -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" defer></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" defer></script>
    <script src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js' defer></script>
</head>
<body>

<div id="loader">
    <div class="spinner"></div>
    <div id="loader-text" style="margin-top:10px; font-weight:bold;">Lädt...</div>
    <button class="btn btn-secondary" id="stopGeoBtn" style="margin-top:20px; display:none;" data-action="setFlag" data-flag="stopGeocoding" data-value="true">STOPP</button>
</div>
<button id="menu-toggle" data-action="toggleSidebar" data-args="">☰</button>

<div id="timeModal" class="modal-overlay">
    <div class="modal-box">
        <h2 style="text-align:center">Zeit wählen</h2>
        <input type="time" id="modalTime" value="09:00" style="font-size:24px; text-align:center; padding:10px; width:100%;">
        <div class="grid-2" style="margin-top:20px;">
            <button class="btn btn-primary btn-full" data-action="confirmDrop" data-args="">Speichern</button>
            <button class="btn btn-secondary btn-full" data-action="closeModal" data-args="">Abbrechen</button>
        </div>
    </div>
</div>

<div id="pinModal" class="modal-overlay" style="display:none;">
  <div class="modal-box" style="max-width:360px;">
    <h2 style="text-align:center">🔒 CRM gesperrt</h2>
    <p style="margin-top:0; color:var(--text-light); text-align:center;">Bitte PIN eingeben.</p>
    <label>PIN</label>
    <input id="pinInput" type="password" inputmode="numeric" autocomplete="off" placeholder="••••" />
    <div class="grid-2" style="margin-top:10px;">
      <button class="btn btn-primary btn-full" data-action="pinUnlock">Entsperren</button>
      <button class="btn btn-secondary btn-full" data-action="pinLogout">Schließen</button>
    </div>
    <div id="pinError" style="margin-top:10px; font-size:12px; color:var(--stat-red); text-align:center; display:none;">Falsche PIN.</div>
  </div>
</div>


<div id="eventModal" class="modal-overlay">
    <div class="modal-box">
        <h2 style="text-align:center">Termin</h2>
        <input type="hidden" id="evtId">
        <label>Titel / Art</label>
        <div style="display:flex; gap:5px; margin-bottom:10px;">
            <input id="evtTitle" placeholder="Titel" style="margin:0;">
            <select style="width:40px;" onchange="document.getElementById('evtTitle').value=this.value">
                <option value="">...</option><option>Büro</option><option>Meeting</option><option>Werkstatt</option><option>Privat</option><option>Arzt</option><option>Urlaub</option>
            </select>
        </div>
        <div class="grid-2">
            <div><label>Datum</label><input type="date" id="evtDate" style="margin:0;"></div>
            <div><label>Von</label><input type="time" id="evtStart" value="09:00" style="margin:0;"></div>
        </div>
        <div style="margin-top:10px;"><label>Bis</label><input type="time" id="evtEnd" value="10:00" style="margin:0;"></div>
        <div class="grid-2" style="margin-top:20px;">
            <button class="btn btn-success btn-full" data-action="saveManualEvent" data-args="">Speichern</button>
            <button class="btn btn-danger btn-full" data-action="delManualEvent" data-args="" id="btnDelEvt" style="display:none;">Löschen</button>
            <button class="btn btn-secondary btn-full" data-action="closeEventModal">Abbrechen</button>
        </div>
    </div>
</div>

<div id="sidebar">
    <div class="logo-area">
        <img id="sidebar-logo" src="" class="logo-img" alt="Logo">
        <div id="text-logo" style="display:none; font-weight:800;">Raphaels CRM</div>
    </div>
    <div class="nav-menu">
        <!-- Global Search (offline) -->
        <input id="globalSearch" type="search" placeholder="🔎 Suche (Kunden, Aufgaben, Berichte)" style="margin-bottom:10px;" autocomplete="off">
        <button class="nav-item active" data-action="nav" data-args="'home', this">🏠 Dashboard</button>
        <button class="nav-item" data-action="nav" data-args="'agenda', this">🗓️ Agenda</button>
        <button class="nav-item" data-action="nav" data-args="'customers', this">👥 Kunden</button>
        <button class="nav-item" data-action="nav" data-args="'expenses', this">💶 Spesen</button>
        <button class="nav-item" data-action="nav" data-args="'map', this">🗺️ Karte</button>
        <button class="nav-item" data-action="nav" data-args="'calendar', this">📅 Kalender</button>
        <button class="nav-item" data-action="nav" data-args="'tour', this">🚗 Tour</button>
        <button class="nav-item" data-action="nav" data-args="'routes', this">📂 Routen</button>
    </div>
</div>

<div id="main"><div id="content" class="content-wrap"></div></div>

<script>
    const DB_KEY = 'raphael_crm_v122_revenue';
    const DEFAULT_LOGO = "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%230f172a' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Crect x='2' y='7' width='20' height='14' rx='2' ry='2'/%3E%3Cpath d='M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16'/%3E%3C/svg%3E";
    
    let db = { customers: [], tour: [], home: "", expenses: [], logo: null, events: [] };
    let currentCalDate = new Date();
    let calView = 'month'; 
    let dragId = null, dragTargetDate = null;
    let selectMode = false;
    let selectedIds = new Set();
    let viewState = { sort: 'name', search: '', filterRoute: null };
    let mapInstance = null; 
    let editingExpenseId = null;
    window.currentOcrImage = null; 
    let stopGeocoding = false;

    window.onload = () => {
        try {
            const current = JSON.parse(localStorage.getItem(DB_KEY));
            if (current) db = current;
            else {
                const legacy = JSON.parse(localStorage.getItem('raphael_crm_v121_visualcat')) || JSON.parse(localStorage.getItem('raphael_crm_v120_fixedcal'));
                if(legacy) { db = legacy; save(); }
            }

            if(!db.expenses) db.expenses = [];
            if(!db.events) db.events = [];
            if(!db.customers) db.customers = [];
            
            if(!db.meta_revenue_migrated) {
                db.customers.forEach(c => {
                    c.products = ""; 
                });
                db.meta_revenue_migrated = true;
                save();
            }

            db.customers.forEach(c => {
                if(!c.reports) c.reports = [];
                if(!c.tasks) c.tasks = [];
                if(!c.nextAppointment) c.nextAppointment = "";
                if(!c.visitInterval) c.visitInterval = 4;
            });
            updateLogoUI();
            showHome();
        } catch(e) {
            console.error(e);
            alert("Fehler beim Starten: " + e.message + "\nBitte Backup prüfen.");
        } finally {
            document.getElementById('loader').style.display='none';
        }
    };

    function save() { localStorage.setItem(DB_KEY, JSON.stringify(db)); }
    function updateLogoUI() {
        const img = document.getElementById('sidebar-logo');
        const txt = document.getElementById('text-logo');
        if(db.logo) { img.src = db.logo; img.style.display = 'inline-block'; txt.style.display = 'none'; } 
        else { img.src = DEFAULT_LOGO; img.style.display = 'inline-block'; txt.style.display = 'none'; }
    }

    function nav(page, el) {
        document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
        if(el) el.classList.add('active');
        if(window.innerWidth <= 768) toggleSidebar();
        selectMode = false; selectedIds.clear();
        viewState.filterRoute = null; 
        if(mapInstance) { mapInstance.remove(); mapInstance = null; }
        if(page === 'home') showHome();
        else if(page === 'map') showMap();
        else if(page === 'calendar') showCalendar();
        else if(page === 'customers') showCustomers();
        else if(page === 'tour') showTour();
        else if(page === 'routes') showRoutes();
        else if(page === 'expenses') showExpenses();
    }
    function toggleSidebar() { document.getElementById('sidebar').classList.toggle('open'); }

    // --- CSV IMPORT ---
    function importCSV(input) {
        const f = input.files[0];
        if(!f) return;
        const r = new FileReader();
        r.readAsText(f, 'UTF-8');
        r.onload = e => {
            const text = e.target.result;
            const lines = text.split(/\r\n|\n/).filter(line => line.trim() !== '');
            if(lines.length < 2) return alert("Datei leer oder ungültig");
            const firstLine = lines[0];
            const sep = firstLine.includes(';') ? ';' : ','; 
            const headers = firstLine.split(sep).map(h => h.replace(/"/g, '').trim().toLowerCase());
            const iName = headers.findIndex(h => h === 'name');
            const iStr = headers.findIndex(h => h.includes('straße') || h.includes('str'));
            const iPlz = headers.findIndex(h => h === 'plz');
            const iOrt = headers.findIndex(h => h === 'ort');
            const iTel = headers.findIndex(h => h.includes('tel'));
            const iNr = headers.findIndex(h => h === 'nr' || h.includes('kundennummer'));
            const iTour = headers.findIndex(h => h === 'tour');
            if (iName === -1) return alert("Fehler: Spalte 'Name' nicht gefunden.");
            let count = 0;
            for (let i = 1; i < lines.length; i++) {
                const row = lines[i].split(sep).map(s => s.replace(/^"|"$/g, '').trim());
                const name = row[iName];
                let addressParts = [];
                if(iStr > -1 && row[iStr]) addressParts.push(row[iStr]);
                if(iPlz > -1 && row[iPlz] && iOrt > -1 && row[iOrt]) {
                    addressParts.push(row[iPlz] + " " + row[iOrt]);
                } else {
                    if(iPlz > -1 && row[iPlz]) addressParts.push(row[iPlz]);
                    if(iOrt > -1 && row[iOrt]) addressParts.push(row[iOrt]);
                }
                const fullAddress = addressParts.join(', ');
                if (name && !db.customers.some(x => x.name === name)) {
                    db.customers.push({
                        id: Date.now() + i, name: name, address: fullAddress, 
                        phone: iTel > -1 ? row[iTel] : "", nr: iNr > -1 ? row[iNr] : "",
                        route: iTour > -1 ? row[iTour] : "", category: 'C', status: 'aktiv', 
                        products: '', reports: [], nextAppointment: '', visitInterval: 4, tasks: []
                    });
                    count++;
                }
            }
            save(); alert(count + " Kunden importiert!"); showHome();
        };
    }

    // --- DASHBOARD ---
    function showHome(){
        const today=new Date().toLocaleDateString('de-DE');
        const count=db.customers.length;
        const visited=db.customers.filter(c=>c.reports&&c.reports.some(r=>r.date===today)).length;
        const openTasksCount = db.customers.reduce((sum, c) => sum + (c.tasks ? c.tasks.filter(t => !t.done).length : 0), 0);

        let stats={};
        for(let i=5;i>=0;i--){
            const d=new Date();d.setMonth(d.getMonth()-i);
            const k=d.toLocaleString('de',{month:'short'});
            stats[k]=0;
            db.customers.forEach(c=>c.reports.forEach(r=>{const[D,M,Y]=r.date.split('.');if(parseInt(M)==d.getMonth()+1&&parseInt(Y)==d.getFullYear()) stats[k]++;}));
        }
        const maxV=Math.max(...Object.values(stats))||1;

    async function processOCR(input) {
        const file = input.files[0];
        if(!file) return;
        const status = document.getElementById('ocrStatus');
        status.innerText = "Bild wird verarbeitet...";
        
        const reader = new FileReader();
        reader.onload = (e) => {
            document.getElementById('ocr-preview').src = e.target.result;
            document.getElementById('ocr-preview').style.display = 'block';
            window.currentOcrImage = e.target.result; 
        };
        reader.readAsDataURL(file);
        
        try {
            const worker = await Tesseract.createWorker('deu');
            status.innerText = "Lese Zahlen & Text...";
            const ret = await worker.recognize(file);
            const text = ret.data.text;
            const lines = ret.data.lines.map(l => l.text.trim()).filter(l => l.length > 2);
            
            if(lines.length > 0) document.getElementById('exp-note').value = lines[0];

            const dateMatch = text.match(/(\d{2})[\.\/-](\d{2})[\.\/-](\d{2,4})/);
            if(dateMatch) {
                let y = dateMatch[3];
                if(y.length === 2) y = "20" + y;
                document.getElementById('exp-date').value = `${y}-${dateMatch[2]}-${dateMatch[1]}`;
            }

            let maxVal = 0.0;
            const currentYear = new Date().getFullYear();
            
            lines.forEach(l => {
                const numbers = l.match(/[0-9]+[,.][0-9]{2}\b/g);
                if(numbers) {
                    numbers.forEach(numStr => {
                        let cleanStr = numStr.replace(/\./g, 'X').replace(/,/g, '.').replace(/X/g, ''); 
                        if(numStr.includes(';')) { cleanStr = numStr.replace(/\./g, '').replace(',', '.'); }
                        
                        const val = parseFloat(cleanStr);
                        if(!isNaN(val)) {
                            if(val >= currentYear -1 && val <= currentYear + 1) {} 
                            else { if(val > maxVal) maxVal = val; }
                        }
                    });
                }
            });
            
            if(maxVal > 0) document.getElementById('exp-amount').value = maxVal.toFixed(2);

            const t = text.toLowerCase();
            const cat = document.getElementById('exp-cat');
            if(t.includes('tank') || t.includes('liter') || t.includes('diesel') || t.includes('super') || t.includes('shell') || t.includes('aral')) cat.value = 'Tanken';
            else if(t.includes('park') || t.includes('ticket')) cat.value = 'Parken';
            else if(t.includes('hotel') || t.includes('zimmer')) cat.value = 'Hotel';
            else if(t.includes('burger') || t.includes('mcdonald') || t.includes('essen') || t.includes('trinken')) cat.value = 'Verpflegung';
            
            status.innerText = "Scan fertig!";
            await worker.terminate();
        } catch(e) {
            status.innerText = "Fehler: " + e.message;
        }
    }

                if(!db.expenses)db.expenses=[];
                db.expenses.unshift({id:Date.now(),date:dateStr,amount:amount,category:cat,note:note,img:imgData});
            }
            save(); 
            showExpenses(); 
        };
        if(file){

            r.onload=e=>{
                const img=new Image();

                    const cvs=document.createElement('canvas'); const ctx=cvs.getContext('2d');

                }; img.src=e.target.result;
            }; r.readAsDataURL(file);
        } else if (window.currentOcrImage) {
            saveExp(window.currentOcrImage);
        } else { saveExp(null); }
    }

    function showMap(){document.getElementById('content').innerHTML=`<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;"><h1>Kundenkarte</h1><button class="btn btn-primary" data-action="batchGeocode" data-args="">📍 Positionen laden</button></div><div id="map-container"></div>`;setTimeout(()=>{if(mapInstance){mapInstance.remove();mapInstance=null;}mapInstance=L.map('map-container').setView([51.1657,10.4515],6);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap'}).addTo(mapInstance);let group=L.featureGroup();let hasMarkers=false;db.customers.forEach(c=>{if(c.lat&&c.lon){const st=getStatus(c);const color=st==='red'?'red':(st==='yellow'?'gold':'green');const marker=L.circleMarker([c.lat,c.lon],{color:color,fillColor:color,fillOpacity:0.8,radius:8}).bindPopup(`<b>${c.name}</b><br>${c.address}<br><button data-action="showDetail" data-args="${c.id}" style="margin-top:5px;">Öffnen</button>`);marker.addTo(group);hasMarkers=true;}});if(hasMarkers){mapInstance.addLayer(group);mapInstance.fitBounds(group.getBounds(),{padding:[50,50]});}},100);}
    async function batchGeocode(){
        const missing=db.customers.filter(c=>!c.lat&&c.address.length>5);
        if(missing.length===0)return alert("Alle Adressen haben bereits Koordinaten.");
        if(!confirm(`${missing.length} Kunden ohne Koordinaten. Laden?`))return;
        document.getElementById('loader').style.display='flex';
        document.getElementById('stopGeoBtn').style.display='block';
        stopGeocoding=false;
        
        for(let i=0;i<missing.length;i++){
            if(stopGeocoding) break;
            const c=missing[i];
            document.getElementById('loader-text').innerText = `Lade ${i+1} von ${missing.length}...`;
            try{
                const r=await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(c.address)}`);
                const d=await r.json();
                if(d&&d[0]){c.lat=d[0].lat;c.lon=d[0].lon;}
            }catch(e){}
            if(i%10===0) save(); 
            await new Promise(r=>setTimeout(r,1100));
        }
        save();
        document.getElementById('loader').style.display='none';
        document.getElementById('stopGeoBtn').style.display='none';
        showMap();
    }

    function generateReportPDF(range){

        const dateStr=today.toLocaleDateString('de-DE');
        let reportData=[];
        
        db.customers.forEach(c=>{
            (c.reports||[]).forEach(r=>{
                const parts=r.date.split('.');
                if(parts.length===3){
                    const repDate=new Date(parts[2],parts[1]-1,parts[0]);
                    let include=false;
                    if(range==='day'&&r.date===dateStr) include=true;
                    if(range==='week'){
                        const diff=(today-repDate)/(1000*60*60*24);
                        if(diff<=7&&diff>=0) include=true;
                    }
                    if(include) reportData.push({...r, customerName:c.name, rawDate: repDate});
                }
            });
        });

        if(reportData.length===0) return alert("Keine Berichte gefunden.");

        reportData.sort((a,b) => a.rawDate - b.rawDate);

        let html=`<div class="no-print" style="margin-bottom:20px;"><button class="btn btn-primary" data-action="printPage">Drucken</button> <button class="btn btn-secondary" data-action="showHome" data-args="">Zurück</button></div><h1>${range==='day'?'Tagesbericht':'Wochenbericht'}</h1>`;

        });
        
        document.getElementById('content').innerHTML=html;
    }

    function showTour(){const l=db.tour.map(id=>{const c=db.customers.find(x=>x.id===id);return c?`<div class="card" style="padding:15px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;"><div><b>${c.name}</b><br>${c.address}</div><button class="btn btn-secondary" data-action="togTourThenShow" data-args="${id}">Entf</button></div>`:'';}).join('');document.getElementById('content').innerHTML=`<h1>Tour Planer</h1><div class="grid-2"><div><div class="card"><h3>Start</h3><input id="t-start" value="${db.home||''}"><button class="btn btn-primary btn-full" data-action="saveHomeStart">Speichern</button><hr style="margin:20px 0;border:0;border-top:1px solid #eee;"><button class="btn btn-primary btn-full" data-action="optTour" data-args="">⚡ Optimieren</button><button class="btn btn-secondary btn-full" style="margin-top:10px;" data-action="openMaps" data-args="">🗺️ Maps</button><button class="btn btn-danger btn-full" style="margin-top:10px;" data-action="clearTourConfirm">Leeren</button></div></div><div>${l||'Leer'}${db.home?`<div class="card" style="background:#f8fafc; border:1px dashed #ccc; text-align:center; padding:15px; margin-top:10px; font-weight:bold; color:#666;">🏁 Rückfahrt (Zuhause)<br>${db.home}</div>`:''}</div></div>`;}
    async function optTour(){if(!db.home||db.tour.length<2)return alert("Brauche Start und >2 Kunden");document.getElementById('loader').style.display='flex';const getC=async(a)=>{try{const r=await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(a)}`);const d=await r.json();return d[0]?{lat:d[0].lat,lon:d[0].lon}:null;}catch(e){return null;}};const start=await getC(db.home);if(!start){document.getElementById('loader').style.display='none';return alert("Start nicht gefunden");}let pts=[];for(let id of db.tour){const c=db.customers.find(x=>x.id===id);const co=await getC(c.address);if(co)pts.push({id,co});}let sorted=[],cur=start;while(pts.length){pts.sort((a,b)=>(Math.pow(a.co.lat-cur.lat,2)+Math.pow(a.co.lon-cur.lon,2))-(Math.pow(b.co.lat-cur.lat,2)+Math.pow(b.co.lon-cur.lon,2)));const n=pts.shift();sorted.push(n.id);cur=n.co;}db.tour=sorted;save();document.getElementById('loader').style.display='none';showTour();}
    function openMaps(){const d=db.tour.map(id=>encodeURIComponent(db.customers.find(x=>x.id===id).address)).join('/');window.open(`https://www.google.com/maps/dir/$${encodeURIComponent(db.home)}/${d}/${encodeURIComponent(db.home)}`,'_blank');}

    function showRoutes(){const r=[...new Set(db.customers.map(c=>c.route).filter(x=>x))].sort();document.getElementById('content').innerHTML=`<h1>Routen</h1><div class="grid-3">${r.map(x=>`<div class="card" data-action="filterRoute" data-args="'${x}'" style="cursor:pointer;text-align:center;"><h2>${x}</h2><div style="color:#666">${db.customers.filter(c=>c.route===x).length} Kunden</div></div>`).join('')}</div>`;}

    function importBackup(input){const f=input.files[0];if(!f)return;const r=new FileReader();r.onload=e=>{try{db=JSON.parse(e.target.result);save();alert("Backup OK");showHome();}catch(e){alert("Fehler");}};r.readAsText(f);}
    
    async function downloadBackup() {
        const now = new Date();
        const ts = now.getFullYear() + '-' +
                   String(now.getMonth()+1).padStart(2,'0') + '-' +
                   String(now.getDate()).padStart(2,'0') + '_' +
                   String(now.getHours()).padStart(2,'0') + '-' +
                   String(now.getMinutes()).padStart(2,'0') + '-' +
                   String(now.getSeconds()).padStart(2,'0');
        const filename = `crm_backup_${ts}.json`;
        const jsonStr = JSON.stringify(db, null, 2);

        if (window.showSaveFilePicker) {
            try {
                const handle = await window.showSaveFilePicker({
                    suggestedName: filename,
                    types: [{ description: 'JSON Database', accept: {'application/json': ['.json']} }],
                });
                const writable = await handle.createWritable();
                await writable.write(jsonStr);
                await writable.close();
                alert("Backup erfolgreich gespeichert!");
                return;
            } catch (err) {
                if (err.name !== 'AbortError') console.error(err);
                return; 
            }
        }

        const blob = new Blob([jsonStr], {type: "application/json"});
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
    }

    // --- DUPLIKATE ---
    function showDuplicates() {
        const groups = {};
        db.customers.forEach(c => {
            const key = (c.address || '').toLowerCase().replace(/[^a-z0-9]/g, '');
            if (!key) return; 
            if (!groups[key]) groups[key] = [];
            groups[key].push(c);
        });

        const duplicates = Object.values(groups).filter(g => g.length > 1);

        if (duplicates.length === 0) return alert("Keine doppelten Adressen gefunden.");

        let html = `<h1>Doppelte Einträge (${duplicates.length} Gruppen)</h1>`;
        duplicates.forEach(group => {
            html += `<div class="card" style="border-left:4px solid #ef4444;">
                <h3>📍 ${group[0].address}</h3>
                ${group.map(c => `
                    <div style="display:flex; justify-content:space-between; align-items:center; border-top:1px solid #eee; padding:10px 0;">
                        <div>
                            <b>${c.name}</b> <span style="font-size:10px; color:#666;">(ID: ${c.id})</span><br>
                            Tour: ${c.route || '-'} | Status: ${c.status}
                        </div>
                        <button class="btn btn-danger" style="font-size:12px;" data-action="deleteDuplicate" data-args="${c.id}">Löschen</button>
                    </div>
                `).join('')}
            </div>`;
        });
        html = `<div class="no-print" style="margin-bottom:15px;"><button class="btn btn-secondary" data-action="showHome" data-args="">← Zurück</button></div>` + html;
        document.getElementById('content').innerHTML = html;
    }

    function deleteDuplicate(id) {
        if(confirm("Diesen Eintrag wirklich löschen?")) {
            db.customers = db.customers.filter(c => c.id !== id);
            db.tour = db.tour.filter(x => x !== id);
            save();
            showDuplicates(); 
        }
    }

    // --- CALENDAR LOGIC ---
    function showCalendar() { const mNames=["Jan","Feb","Mär","Apr","Mai","Jun","Jul","Aug","Sep","Okt","Nov","Dez"]; const h=calView==='day'?currentCalDate.toLocaleDateString():(calView==='year'?currentCalDate.getFullYear():`${mNames[currentCalDate.getMonth()]} ${currentCalDate.getFullYear()}`); document.getElementById('content').innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:15px;"><div><button class="btn btn-secondary" data-action="changeCal" data-args="-1">◀</button><span style="font-weight:bold;margin:0 15px;">${h}</span><button class="btn btn-secondary" data-action="changeCal" data-args="1">▶</button></div><div style="display:flex; gap:10px;"><button class="btn btn-success" data-action="openEventModal" data-args="">+</button><div class="view-controls"><button class="view-btn ${calView==='day'?'active':''}" data-action="setCalView" data-view="day">Tag</button><button class="view-btn ${calView==='week'?'active':''}" data-action="setCalView" data-view="week">Woche</button><button class="view-btn ${calView==='month'?'active':''}" data-action="setCalView" data-view="month">Monat</button><button class="view-btn ${calView==='year'?'active':''}" data-action="setCalView" data-view="year">Jahr</button></div></div></div><div class="cal-layout"><div class="cal-pool"><div style="padding:10px;border-bottom:1px solid #eee;background:#f1f5f9;"><label style="font-size:10px;font-weight:bold;color:#999;">POOL</label><select id="poolFilter" onchange="renderPoolList()" style="width:100%;margin-top:5px;"><option value="">Alle</option>${[...new Set(db.customers.map(c=>c.route).filter(r=>r))].map(r=>`<option>${r}</option>`).join('')}</select></div><div id="poolContainer" class="pool-list"></div></div><div id="calMain" class="cal-main"></div></div>`; renderPoolList(); renderCalView(); }
    function renderCalView(){const c=document.getElementById('calMain');c.innerHTML='';if(calView==='month')renderMonth(c);if(calView==='day')renderDay(c);if(calView==='week')renderWeek(c);if(calView==='year')renderYear(c);}
    function renderMonth(con){const y=currentCalDate.getFullYear(),m=currentCalDate.getMonth();const d=new Date(y,m+1,0).getDate();const off=(new Date(y,m,1).getDay()+6)%7;let h=`<div class="calendar-grid">`;['Mo','Di','Mi','Do','Fr','Sa','So'].forEach(x=>h+=`<div class="cal-head">${x}</div>`);for(let i=0;i<off;i++)h+=`<div></div>`;for(let i=1;i<=d;i++){const ds=`${y}-${String(m+1).padStart(2,'0')}-${String(i).padStart(2,'0')}`;h+=`<div class="cal-day ${new Date().toISOString().slice(0,10)===ds?'today':''}" ondragover="event.preventDefault()" ondrop="drop(event,'${ds}')"><b>${i}</b>${getEvts(ds)}</div>`;}con.innerHTML=h+`</div>`;}
    function renderDay(con){let h=`<div style="overflow-y:auto;height:100%;">`;const ds=currentCalDate.toISOString().slice(0,10);for(let i=8;i<=18;i++){const t=String(i).padStart(2,'0')+':00';h+=`<div style="display:flex;border-bottom:1px solid #eee;min-height:60px;" ondragover="event.preventDefault()" ondrop="dropTime(event,'${ds}','${t}')"><div style="width:50px;padding:10px;font-size:11px;color:#999;border-right:1px solid #eee;">${t}</div><div style="flex:1;padding:5px;">${getEvts(ds,t)}</div></div>`;}con.innerHTML=h+`</div>`;}
    function renderWeek(con){const d=new Date(currentCalDate);const mon=new Date(d.setDate(d.getDate()-((d.getDay()+6)%7)));let h=`<div style="overflow-y:auto;height:100%;">`;for(let i=0;i<7;i++){const c=new Date(mon);c.setDate(mon.getDate()+i);const ds=c.toISOString().slice(0,10);h+=`<div style="padding:10px;border-bottom:1px solid #eee;min-height:100px;" ondragover="event.preventDefault()" ondrop="drop(event,'${ds}')"><b>${c.toLocaleDateString()}</b><div style="margin-top:5px;">${getEvts(ds)}</div></div>`;}con.innerHTML=h+`</div>`;}

/* ============================================================
   EVENT-DELEGATION + KEYBOARD (CSP-freundlich)
   - Alle Klicks laufen über data-action / data-args
   - Kein inline-onclick mehr
   - Esc schließt Modals / Enter speichert im Termin-Modal
   ============================================================ */
(function wireDelegation(){
  function parseArgs(raw) {
    if (!raw) return [];
    const parts = [];
    let cur = '', q = null;
    for (let i=0;i<raw.length;i++){
      const ch = raw[i];
      if ((ch === '"' || ch === "'")) {
        if (q === ch) q = null;
        else if (!q) q = ch;
        cur += ch; continue;
      }
      if (ch === ',' && !q) { parts.push(cur.trim()); cur=''; continue; }
      cur += ch;
    }
    if (cur.trim()) parts.push(cur.trim());
    return parts.map(p => {
      if (p === 'this') return null;
      if ((p.startsWith("'") && p.endsWith("'")) || (p.startsWith('"') && p.endsWith('"'))) return p.slice(1,-1);
      if (p === 'true') return true;
      if (p === 'false') return false;
      if (p === 'null') return null;
      const n = Number(p);
      if (!Number.isNaN(n) && p !== '') return n;
      return p;
    });
  }

  document.addEventListener('click', (ev) => {
    const el = ev.target.closest('[data-action]');
    if (!el) return;

    const action = el.getAttribute('data-action');
    const args = parseArgs(el.getAttribute('data-args') || '');

    // Replace legacy 'this' placeholders with element
    for (let i=0;i<args.length;i++) if (args[i] === null) args[i] = el;

    try {
      if (typeof window[action] === 'function') {
        window[action](...args, el);
      } else {
        console.warn('Unbekannte Aktion:', action, el);
      }
    } catch (e) {
      console.error('Action-Fehler:', action, e);
      alert('Fehler bei Aktion: ' + action + '\n' + (e && e.message ? e.message : e));
    }

    if (el.tagName === 'BUTTON' || el.tagName === 'A') ev.preventDefault();
  }, {passive:false});

  // Keyboard UX
  document.addEventListener('keydown', (ev) => {
    if (ev.key === 'Escape') {
      const evt = document.getElementById('eventModal');
      if (evt && evt.style.display === 'flex') { evt.style.display = 'none'; return; }
      const tm = document.getElementById('timeModal');
      if (tm && tm.style.display === 'flex') { tm.style.display = 'none'; return; }
    }
    if (ev.key === 'Enter') {
      const evt = document.getElementById('eventModal');
      if (evt && evt.style.display === 'flex') {
        const tag = (ev.target && ev.target.tagName || '').toLowerCase();
        if (tag !== 'textarea') {
          ev.preventDefault();
          if (typeof window.saveManualEvent === 'function') window.saveManualEvent();
        }
      }
    }
  });

  // Basic focus management when opening modals (if functions exist)
  const _openEventModal = window.openEventModal;
  if (typeof _openEventModal === 'function') {
    window.openEventModal = function(...a){
      _openEventModal.apply(this, a);
      setTimeout(()=>{ const first = document.querySelector('#eventModal input, #eventModal select, #eventModal textarea, #eventModal button'); if(first) first.focus(); }, 0);
    };
  }
})();

/* -------------------- DB MIGRATION -------------------- */
function ensureDBShape(){
  db.settings = db.settings || {};
  db.settings.pinEnabled = !!db.settings.pinEnabled;
  db.settings.pinHash = db.settings.pinHash || null;       // SHA-256 hex
  db.settings.pinLastUnlock = db.settings.pinLastUnlock || null; // ISO
  db.settings.snapshotAuto = (db.settings.snapshotAuto !== false);
  db.settings.snapshotLastDay = db.settings.snapshotLastDay || null; // YYYY-MM-DD

  db.snapshots = db.snapshots || []; // [{id, ts, label, db}]
  db.mileage = db.mileage || [];     // [{id,date,from,to,km,rate,amount,note}]
  db.flags = db.flags || {};         // runtime flags persisted (optional)

  db.customers = db.customers || [];
  db.customers.forEach(c=>{
    c.tags = c.tags || [];           // ['VIP','...']
    c.docs = c.docs || [];           // [{id,name,type,data,ts}]
    c.visitChecklist = c.visitChecklist || null; // custom list or null
    c.route = c.route || '';
    c.tasks = c.tasks || [];
    c.reports = c.reports || [];
  });

  db.expenses = db.expenses || [];
  db.events = db.events || [];       // manual events
}

/* Patch existing onload init to include migrations + auto snapshot + pin */
(function patchInit(){
  const _onload = window.onload;
  window.onload = async function(){
    if (typeof _onload === 'function') await _onload();
    try { ensureDBShape(); save(); } catch {}
    try { await autoSnapshotDaily(); } catch {}
    try { await maybeShowPinLock(); } catch {}
    try { installKeyboardUX(); } catch {}
    try { installGlobalSearch(); } catch {}
    try { installEnterSaveInModals(); } catch {}
  };
})();

/* -------------------- PIN LOCK -------------------- */
async function sha256Hex(str){
  const enc = new TextEncoder().encode(str);
  const buf = await crypto.subtle.digest('SHA-256', enc);
  return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('');
}

function showPinModal(show){
  const m = document.getElementById('pinModal');
  if (!m) return;
  m.style.display = show ? 'flex' : 'none';
  if (show) {
    const inp = document.getElementById('pinInput');
    const err = document.getElementById('pinError');
    if (err) err.style.display = 'none';
    if (inp) { inp.value=''; setTimeout(()=>inp.focus(), 50); }
  }
}

async function maybeShowPinLock(){
  if (!db?.settings?.pinEnabled || !db.settings.pinHash) return;
  // Option: session unlock for this tab
  if (sessionStorage.getItem('crm_pin_ok') === '1') return;
  showPinModal(true);
}

async function pinUnlock(){
  const inp = document.getElementById('pinInput');
  const err = document.getElementById('pinError');
  const pin = (inp?.value || '').trim();
  if (!pin) return;
  const hash = await sha256Hex(pin);
  if (hash === db.settings.pinHash){
    sessionStorage.setItem('crm_pin_ok','1');
    db.settings.pinLastUnlock = new Date().toISOString();
    save();
    showPinModal(false);
  } else {
    if (err) err.style.display = 'block';
  }
}

function pinLogout(){
  // offline: just close tab hint
  alert('Du kannst das Fenster jetzt schließen.');
}

async function setOrChangePin(){
  const enable = confirm('PIN-Sperre aktivieren/ändern?\nOK = Ja, Abbrechen = deaktivieren');
  if (!enable){
    db.settings.pinEnabled = false;
    db.settings.pinHash = null;
    save();
    alert('PIN-Sperre deaktiviert.');
    return;
  }
  const p1 = prompt('Neue PIN setzen (min. 4 Zeichen):');
  if (!p1 || p1.length < 4) return alert('PIN zu kurz.');
  const p2 = prompt('PIN wiederholen:');
  if (p1 !== p2) return alert('PIN stimmt nicht überein.');
  db.settings.pinEnabled = true;
  db.settings.pinHash = await sha256Hex(p1);
  save();
  alert('PIN gespeichert.');
}

/* -------------------- SNAPSHOTS -------------------- */
function snapshotNowLabel(){
  const d = new Date();
  const pad = n=>String(n).padStart(2,'0');
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

function takeSnapshot(label){
  ensureDBShape();
  const snap = {
    id: Date.now(),
    ts: new Date().toISOString(),
    label: label || `Snapshot ${snapshotNowLabel()}`,
    db: db
  };
  db.snapshots.unshift(snap);
  db.snapshots = db.snapshots.slice(0, 20);
  save();
}

async function autoSnapshotDaily(){
  if (!db?.settings?.snapshotAuto) return;
  const today = new Date().toISOString().slice(0,10);
  if (db.settings.snapshotLastDay === today) return;
  // save pre-mutation snapshot
  takeSnapshot('Auto-Snapshot ' + today);
  db.settings.snapshotLastDay = today;
  save();
}

function restoreSnapshot(id){
  const snap = (db.snapshots||[]).find(s=>String(s.id)===String(id));
  if (!snap) return alert('Snapshot nicht gefunden.');
  if (!confirm('Snapshot wiederherstellen? Aktuelle Daten werden überschrieben.')) return;
  db = snap.db;
  ensureDBShape();
  save();
  location.reload();
}

function deleteSnapshot(id){
  db.snapshots = (db.snapshots||[]).filter(s=>String(s.id)!==String(id));
  save();
  showSettingsPanel();
}

/* -------------------- GLOBAL SEARCH -------------------- */
function installGlobalSearch(){
  const inp = document.getElementById('globalSearch');
  if (!inp) return;
  let t=null;
  inp.addEventListener('input', ()=>{
    clearTimeout(t);
    t=setTimeout(()=>{ showGlobalSearch(inp.value); }, 200);
  });
  inp.addEventListener('keydown', (e)=>{
    if (e.key === 'Escape'){ inp.value=''; showHome(); }
  });
}

function norm(s){ return (s||'').toString().toLowerCase(); }

function showGlobalSearch(q){
  const query = (q||'').trim();
  if (!query){ return; }
  const n = norm(query);
  const todayStr = new Date().toISOString().slice(0,10);

  const cust = db.customers.filter(c=>{
    return norm(c.name).includes(n) || norm(c.address).includes(n) || (c.tags||[]).some(t=>norm(t).includes(n));
  }).slice(0,50);

  const tasks = [];
  db.customers.forEach(c=>{
    (c.tasks||[]).forEach((t,idx)=>{
      if (norm(t.text).includes(n) || (t.dueDate && norm(t.dueDate).includes(n))){
        tasks.push({c, t, idx});
      }
    });
  });

  const reps = [];
  db.customers.forEach(c=>{
    (c.reports||[]).forEach((r,idx)=>{
      if (norm(r.text).includes(n) || norm(r.date).includes(n)){
        reps.push({c,r,idx});
      }
    });
  });

  let html = `<h1>🔎 Suche: ${escapeHtml(query)}</h1>`;

  html += `<div class="card"><h2>Kunden (${cust.length})</h2>` +
    (cust.length ? cust.map(c=>`
      <div class="cust-row" data-action="openCustomer" data-id="${c.id}">
        <div style="display:flex; align-items:center; gap:10px;">
          <div class="check-circle"></div>
          <div><b>${escapeHtml(c.name)}</b><div style="font-size:12px; color:var(--text-light);">${escapeHtml(c.address||'')}</div></div>
        </div>
        <div style="display:flex; gap:6px; align-items:center;">
          ${scoreBadge(c)}
        </div>
      </div>`).join('') : `<div style="padding:10px; color:var(--text-light);">Keine Treffer</div>`) +
    `</div>`;

  html += `<div class="card"><h2>Aufgaben (${tasks.length})</h2>` +
    (tasks.length ? tasks.slice(0,50).map(x=>{
      const overdue = x.t.dueDate && x.t.dueDate < todayStr && !x.t.done;
      return `<div class="task-mini-row">
        <input type="checkbox" class="task-chk" ${x.t.done?'checked':''} data-action="toggleTaskFromSearch" data-cid="${x.c.id}" data-idx="${x.idx}">
        <div style="flex:1;">
          <div style="font-weight:700; ${overdue?'color:var(--stat-red);':''}">${escapeHtml(x.t.text)}</div>
          <div style="font-size:12px; color:var(--text-light); cursor:pointer;" data-action="openCustomer" data-id="${x.c.id}">👤 ${escapeHtml(x.c.name)} ${x.t.dueDate?('• 📅 '+escapeHtml(x.t.dueDate)) : ''}</div>
        </div>
      </div>`;
    }).join('') : `<div style="padding:10px; color:var(--text-light);">Keine Treffer</div>`) +
    `</div>`;

  html += `<div class="card"><h2>Berichte (${reps.length})</h2>` +
    (reps.length ? reps.slice(0,50).map(x=>`
      <div class="report-entry" style="cursor:pointer;" data-action="openCustomer" data-id="${x.c.id}">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <b>${escapeHtml(x.c.name)}</b>
          <span style="font-size:12px; color:var(--text-light);">${escapeHtml(x.r.date||'')}</span>
        </div>
        <div style="margin-top:6px; color:#374151; white-space:pre-wrap;">${escapeHtml((x.r.text||'').slice(0,220))}${(x.r.text||'').length>220?'…':''}</div>
      </div>`).join('') : `<div style="padding:10px; color:var(--text-light);">Keine Treffer</div>`) +
    `</div>`;

  document.getElementById('content').innerHTML = html;
}

/* -------------------- AGENDA + REMINDERS -------------------- */
function showAgenda(){
  const today = new Date();
  const todayISO = today.toISOString().slice(0,10);
  const todayDE = today.toLocaleDateString('de-DE');

  const overdueTasks = [];
  const dueTasks = [];
  db.customers.forEach(c=>{
    (c.tasks||[]).forEach((t,idx)=>{
      if (t.done) return;
      if (t.dueDate){
        if (t.dueDate < todayISO) overdueTasks.push({c,t,idx});
        else if (t.dueDate === todayISO) dueTasks.push({c,t,idx});
      }
    });
  });

  const manualEvents = (db.events||[]).filter(e=>e.date===todayISO).sort((a,b)=>(a.start||'').localeCompare(b.start||''));
  const nextAppointments = db.customers
    .filter(c=>c.nextAppointment && c.nextAppointment.slice(0,10)===todayISO)
    .sort((a,b)=>a.nextAppointment.localeCompare(b.nextAppointment));

  let html = `<h1>🗓️ Agenda – ${todayDE}</h1>`;

  html += `<div class="grid-2">
    <div>
      <div class="card">
        <h2>Termine</h2>
        ${nextAppointments.length? nextAppointments.map(c=>`
          <div class="cust-row" data-action="openCustomer" data-id="${c.id}">
            <div style="display:flex; align-items:center; gap:10px;">
              <div class="check-circle"></div>
              <div>
                <b>${escapeHtml(c.name)}</b>
                <div style="font-size:12px; color:var(--text-light);">${escapeHtml(c.nextAppointment.replace('T',' ').slice(0,16))}</div>
              </div>
            </div>
            ${scoreBadge(c)}
          </div>`).join('') : `<div style="padding:10px; color:var(--text-light);">Keine Kundentermine heute</div>`}
        <div style="height:12px"></div>
        <h3 style="margin:0 0 10px 0;">Manuelle Termine</h3>
        ${manualEvents.length? manualEvents.map(e=>`
          <div class="report-entry" style="border-left-color: var(--event-blue-text); background: var(--event-blue);">
            <b>${escapeHtml(e.title||'Termin')}</b>
            <div style="font-size:12px;">${escapeHtml(e.start||'')} – ${escapeHtml(e.end||'')}</div>
          </div>`).join('') : `<div style="padding:10px; color:var(--text-light);">Keine manuellen Termine</div>`}
        <button class="btn btn-primary btn-full" style="margin-top:10px;" data-action="openEventModal">➕ Termin hinzufügen</button>
      </div>
    </div>
    <div>
      <div class="card">
        <h2>Aufgaben</h2>
        ${overdueTasks.length? `<div style="color:var(--stat-red); font-weight:800; margin-bottom:10px;">Überfällig (${overdueTasks.length})</div>`:''}
        ${(overdueTasks.concat(dueTasks)).slice(0,80).map(x=>{

/* -------------------- SCORE + TAGS -------------------- */
function getLastReportDate(c){
  const r=(c.reports||[])[0];
  if (!r?.date) return null;
  const parts=r.date.split('.');
  if (parts.length!==3) return null;
  return new Date(parts[2], parts[1]-1, parts[0]);
}

function scoreCustomer(c){
  // 0..100 (simple heuristic)
  let s=100;
  const last=getLastReportDate(c);
  const intervalDays=(c.visitInterval||4)*7;
  if (last){
    const diffDays=(Date.now()-last.getTime())/(1000*60*60*24);
    if (diffDays>intervalDays) s-=35;
    if (diffDays>intervalDays+14) s-=25;
  } else {
    s-=25;
  }
  const todayISO=new Date().toISOString().slice(0,10);
  const overdueTasks=(c.tasks||[]).filter(t=>!t.done && t.dueDate && t.dueDate<todayISO).length;
  s -= Math.min(30, overdueTasks*10);
  if (c.nextAppointment && c.nextAppointment.slice(0,10)===todayISO) s-=5;
  s = Math.max(0, Math.min(100, s));
  return s;
}
function scoreColor(score){
  if (score>=75) return 'green';
  if (score>=50) return 'gold';
  return 'red';
}
function scoreBadge(c){
  if (!c) return '';
  const sc=scoreCustomer(c);
  const col=scoreColor(sc);
  const bg = col==='green' ? 'var(--stat-green)' : (col==='gold' ? 'var(--stat-yellow)' : 'var(--stat-red)');
  return `<span class="cat-badge" style="background:${bg}; min-width:46px;">${sc}</span>`;
}

function drawExpenseChart(){
  const cvs=document.getElementById('expChart');
  if(!cvs) return;
  const ctx=cvs.getContext('2d');
  const now=new Date();
  const m=now.getMonth(), y=now.getFullYear();
  const byCat={};
  (db.expenses||[]).forEach(e=>{
    if(!e.date) return;
    const parts=e.date.split('.');
    if(parts.length!==3) return;
    const em=parseInt(parts[1],10)-1, ey=parseInt(parts[2],10);
    if(em!==m || ey!==y) return;
    const cat=e.category||'Sonstiges';
    byCat[cat]=(byCat[cat]||0)+(parseFloat(e.amount)||0);
  });
  const cats=Object.keys(byCat);
  const vals=cats.map(k=>byCat[k]);
  ctx.clearRect(0,0,cvs.width,cvs.height);
  if(!cats.length){
    ctx.fillText('Keine Spesen im aktuellen Monat.', 10, 30);
    return;
  }
  const w=cvs.width, h=cvs.height;
  const max=Math.max(...vals);
  const barW = (w-40)/cats.length;
  cats.forEach((cat,i)=>{
    const v=vals[i];
    const bh = (h-40) * (v/max);
    const x = 20 + i*barW;
    const y = h-20 - bh;
    ctx.fillRect(x, y, barW*0.7, bh);
    ctx.fillText(cat.slice(0,8), x, h-8);
  });
}

  // the base file already has an onGlobalClick; we attach an additional dispatcher
  document.addEventListener('click', async (e)=>{
    const el = e.target.closest('[data-action]');
    if (!el) return;
    const act = el.getAttribute('data-action');
    // Actions we add here:
    try{
      if (act==='pinUnlock'){ e.preventDefault(); await pinUnlock(); }
      else if (act==='pinLogout'){ e.preventDefault(); pinLogout(); }
      else if (act==='setOrChangePin'){ e.preventDefault(); await setOrChangePin(); }
      else if (act==='takeSnapshotManual'){ e.preventDefault(); takeSnapshot('Manuell ' + snapshotNowLabel()); showSettingsPanel(); }
      else if (act==='restoreSnapshot'){ e.preventDefault(); restoreSnapshot(el.getAttribute('data-id')); }
      else if (act==='deleteSnapshot'){ e.preventDefault(); deleteSnapshot(el.getAttribute('data-id')); }
      else if (act==='toggleAutoSnapshots'){ e.preventDefault(); toggleAutoSnapshots(); }
      else if (act==='openCustomer'){ e.preventDefault(); window.currentDetailId = Number(el.getAttribute('data-id')); if (typeof window.showDetail==='function') window.showDetail(window.currentDetailId); }
      else if (act==='toggleTaskFromSearch'){ e.preventDefault(); toggleTaskFromSearch(el); }
      else if (act==='toggleTaskGlobalDelegated'){ e.preventDefault(); toggleTaskGlobalDelegated(el); }
      else if (act==='nav'){ // intercept agenda + settings
        const args = el.getAttribute('data-args') || '';
        if (args.includes('agenda')){ e.preventDefault(); showAgenda(); return; }
        if (args.includes('settings')){ e.preventDefault(); showSettingsPanel(); return; }
      }
      else if (act==='applyTagFilter'){ e.preventDefault(); applyTagFilter(); }
      else if (act==='clearTagFilter'){ e.preventDefault(); clearTagFilter(); }
      else if (act==='saveTags'){ e.preventDefault(); saveTags(Number(el.getAttribute('data-id'))); }
      else if (act==='addChecklistItem'){ e.preventDefault(); addChecklistItem(); }
      else if (act==='saveChecklistTemplate'){ e.preventDefault(); saveChecklistTemplate(Number(el.getAttribute('data-id'))); }
      else if (act==='createReportFromChecklist'){ e.preventDefault(); createReportFromChecklist(Number(el.getAttribute('data-id'))); }
      else if (act==='applyTemplateToReport'){ e.preventDefault(); applyTemplateToReport(); }
      else if (act==='addDoc'){ e.preventDefault(); addDoc(Number(el.getAttribute('data-id'))); }
      else if (act==='openDoc'){ e.preventDefault(); openDoc(Number(el.getAttribute('data-cid')), Number(el.getAttribute('data-id'))); }
      else if (act==='delDoc'){ e.preventDefault(); delDoc(Number(el.getAttribute('data-cid')), Number(el.getAttribute('data-id'))); }
      else if (act==='addMileage'){ e.preventDefault(); addMileage(); }
      else if (act==='delMileage'){ e.preventDefault(); delMileage(Number(el.getAttribute('data-id'))); }
    }catch(err){
      console.error('Action error', act, err);
      alert('Fehler bei Aktion: ' + act);
    }
  }, {capture:true});
})();

function toggleTaskFromSearch(el){
  const cid=Number(el.getAttribute('data-cid'));
  const idx=Number(el.getAttribute('data-idx'));
  const c=db.customers.find(x=>x.id===cid); if(!c) return;
  const t=(c.tasks||[])[idx]; if(!t) return;
  t.done = !t.done;
  save();
  // keep search view
  const inp=document.getElementById('globalSearch');
  if (inp?.value) showGlobalSearch(inp.value); else showHome();
}
function toggleTaskGlobalDelegated(el){
  const cid=Number(el.getAttribute('data-cid'));
  const idx=Number(el.getAttribute('data-idx'));
  const c=db.customers.find(x=>x.id===cid); if(!c) return;
  const t=(c.tasks||[])[idx]; if(!t) return;
  t.done=true;
  save();
  showAgenda();
}

/* -------------------- HOME PATCH: reminders + settings entry -------------------- */
(function patchHome(){
  const _showHome = window.showHome;
  if (typeof _showHome !== 'function') return;
  window.showHome = function(){
    _showHome();
    try { injectRemindersIntoHome(); } catch {}
    try { injectSettingsShortcut(); } catch {}
  };
})();

function injectSettingsShortcut(){
  const content=document.getElementById('content');
  if(!content) return;
  // Add a settings card at bottom if not present
  if (content.querySelector('[data-action=\"openSettings\"]')) return;
  const card=document.createElement('div');
  card.className='card';
  card.innerHTML = `
    <h2>⚙️ System</h2>
    <div class="grid-3">
      <button class="btn btn-secondary btn-full" data-action="nav" data-args="'agenda', null">🗓️ Agenda</button>
      <button class="btn btn-secondary btn-full" data-action="openSettings">⚙️ Einstellungen</button>
      <button class="btn btn-secondary btn-full" data-action="takeSnapshotManual">🕒 Snapshot</button>
    </div>
  `;
  content.appendChild(card);
}

// open settings action
document.addEventListener('click', (e)=>{
  const el=e.target.closest('[data-action=\"openSettings\"]');
  if(!el) return;
  e.preventDefault();
  showSettingsPanel();
}, {capture:true});

/* -------------------- UTIL -------------------- */
function escapeHtml(str){
  return (str||'').toString()
    .replaceAll('&','&amp;')
    .replaceAll('<','&lt;')
    .replaceAll('>','&gt;')
    .replaceAll('\"','&quot;')
    .replaceAll(\"'\",'&#39;');
}
