<script>
/* ============================================================
   GEO-CACHE (Nominatim) – persistent, TTL 180 Tage
   - reduziert Requests
   - schnelleres Kartenladen
   - verhindert Rate-Limit/Block
   ============================================================ */
const GEO_CACHE_KEY = 'crm_geo_cache_v1';
const GEO_TTL_MS = 180 * 24 * 60 * 60 * 1000;

function geoCacheLoad(){
  try { return JSON.parse(localStorage.getItem(GEO_CACHE_KEY) || '{}'); } catch { return {}; }
}
function geoCacheSave(cache){
  try { localStorage.setItem(GEO_CACHE_KEY, JSON.stringify(cache)); } catch {}
}
async function geocodeAddress(address){
  const a = (address||'').trim();
  if (!a) return null;
  const cache = geoCacheLoad();
  const key = a.toLowerCase();
  const now = Date.now();
  const hit = cache[key];
  if (hit && hit.lat && hit.lon && hit.ts && (now - hit.ts) < GEO_TTL_MS) {
    return {lat: hit.lat, lon: hit.lon, cached:true};
  }
  const r = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(a)}`, {
    headers: { 'Accept': 'application/json' }
  });
  const d = await r.json();
  if (d && d[0]) {
    cache[key] = {lat: d[0].lat, lon: d[0].lon, ts: now};
    geoCacheSave(cache);
    return {lat: d[0].lat, lon: d[0].lon, cached:false};
  }
  return null;
}
</script>

    </style>

<script>

    const DB_KEY = 'raphael_crm_v122_revenue';
    const DEFAULT_LOGO = "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%230f172a' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Crect x='2' y='7' width='20' height='14' rx='2' ry='2'/%3E%3Cpath d='M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16'/%3E%3C/svg%3E";
    
    let db = { customers: [], tour: [], home: "", expenses: [], logo: null, events: [] };

    /* ============================================================
       i18n / Text-Helfer
       - Im ursprünglichen UI gab es Aufrufe wie tr('...').
       - Falls kein Übersetzungs-Layer vorhanden ist, ist tr() eine Identity-Funktion.
       ============================================================ */
    function tr(s){ return String(s ?? ''); }

    /* ============================================================
       PIN-Sperre – Guard
       - Stellt sicher, dass isPinLocked() existiert, bevor onload läuft.
       ============================================================ */
    function isPinLocked(){
        try{
            if(!db.security || !db.security.pinEnabled || !db.security.pinHash) return false;
            return sessionStorage.getItem('crm_pin_unlocked_v1') !== '1';
        }catch(e){ return false; }
    }
    // ===== NEU: Schema-Upgrade (damit neue Features mit alten Daten laufen) =====
    // Safari/Chrome-safe: Früh definieren, damit Startlogik es garantiert findet.
    function ensureNewSchema() {
        if (!db || typeof db !== 'object') db = {};
        if (!Array.isArray(db.customers)) db.customers = [];
        if (!Array.isArray(db.expenses)) db.expenses = [];
        if (!Array.isArray(db.events)) db.events = [];
        if (!Array.isArray(db.tour)) db.tour = [];
        if (typeof db.home !== 'string') db.home = '';
        if (db.logo === undefined) db.logo = null;

        // Security / Settings
        if (!db.security || typeof db.security !== 'object') db.security = { pinEnabled: false, pinHash: '' };
        if (!db.settings || typeof db.settings !== 'object') db.settings = { kmRate: 0.30 };

        // Snapshots: eigener Key (separat von DB_KEY) – optional
        if (!Array.isArray(db._migrations)) db._migrations = [];

        // Customer defaults for new modules
        db.customers.forEach(c => {
            if (!c || typeof c !== 'object') return;
            if (!Array.isArray(c.reports)) c.reports = [];
            if (!Array.isArray(c.tasks)) c.tasks = [];
            if (!Array.isArray(c.tags)) c.tags = [];
            if (!Array.isArray(c.docs)) c.docs = []; // {name,type,data,ts}
            if (!Array.isArray(c.checklist)) c.checklist = []; // {text,done}
            if (typeof c.nextAppointment !== 'string') c.nextAppointment = '';
            if (typeof c.visitInterval !== 'number') c.visitInterval = 4;
        });

        // Mark migration
        const v = 'schema_vB_1';
        if (!db._migrations.includes(v)) db._migrations.push(v);
    }
    // explizit global machen (defensiv, für ältere Safari-Scopes)
    window.ensureNewSchema = ensureNewSchema;

    let currentCalDate = new Date();
    let calView = 'month'; 
    let dragId = null, dragTargetDate = null;
    let selectMode = false;
    let selectedIds = new Set();
    let viewState = { sort: 'name', search: '', filterRoute: null };
    let mapInstance = null; 
    let editingExpenseId = null;
    window.currentOcrImage = null; 
    let stopGeocoding = false;

    window.onload = () => {
        try {
            const current = JSON.parse(localStorage.getItem(DB_KEY));
            if (current) db = current;
            else {
                const legacy = JSON.parse(localStorage.getItem('raphael_crm_v121_visualcat')) || JSON.parse(localStorage.getItem('raphael_crm_v120_fixedcal'));
                if(legacy) { db = legacy; save(); }
            }

            if(!db.expenses) db.expenses = [];
            if(!db.events) db.events = [];
            if(!db.customers) db.customers = [];
            
            if(!db.meta_revenue_migrated) {
                db.customers.forEach(c => {
                    c.products = ""; 
                });
                db.meta_revenue_migrated = true;
                save();
            }

            db.customers.forEach(c => {
                if(!c.reports) c.reports = [];
                if(!c.tasks) c.tasks = [];
                if(!c.nextAppointment) c.nextAppointment = "";
                if(!c.visitInterval) c.visitInterval = 4;
            });
            ensureNewSchema();
            updateLogoUI();
            // ===== NEU: PIN-Sperre (optional) =====
            if (isPinLocked()) {
                showPinOverlay();
            } else {
                showHome();
            }
        } catch(e) {
            console.error(e);
            alert("Fehler beim Starten: " + e.message + "\nBitte Backup prüfen.");
        } finally {
            document.getElementById('loader').style.display='none';
        }
    };

    function save() { localStorage.setItem(DB_KEY, JSON.stringify(db)); }
    function updateLogoUI() {
        const img = document.getElementById('sidebar-logo');

    // --- CSV IMPORT ---
    function importCSV(input) {
        const f = input.files[0];
        if(!f) return;
        const r = new FileReader();
        r.readAsText(f, 'UTF-8');
        r.onload = e => {
            const text = e.target.result;
            const lines = text.split(/\r\n|\n/).filter(line => line.trim() !== '');
            if(lines.length < 2) return alert("Datei leer oder ungültig");
            const firstLine = lines[0];
            const sep = firstLine.includes(';') ? ';' : ','; 
            const headers = firstLine.split(sep).map(h => h.replace(/"/g, '').trim().toLowerCase());
            const iName = headers.findIndex(h => h === 'name');
            const iStr = headers.findIndex(h => h.includes('straße') || h.includes('str'));
            const iPlz = headers.findIndex(h => h === 'plz');
            const iOrt = headers.findIndex(h => h === 'ort');
            const iTel = headers.findIndex(h => h.includes('tel'));
            const iNr = headers.findIndex(h => h === 'nr' || h.includes('kundennummer'));
            const iTour = headers.findIndex(h => h === 'tour');
            if (iName === -1) return alert("Fehler: Spalte 'Name' nicht gefunden.");
            let count = 0;
            for (let i = 1; i < lines.length; i++) {
                const row = lines[i].split(sep).map(s => s.replace(/^"|"$/g, '').trim());
                const name = row[iName];
                let addressParts = [];
                if(iStr > -1 && row[iStr]) addressParts.push(row[iStr]);
                if(iPlz > -1 && row[iPlz] && iOrt > -1 && row[iOrt]) {
                    addressParts.push(row[iPlz] + " " + row[iOrt]);
                } else {
                    if(iPlz > -1 && row[iPlz]) addressParts.push(row[iPlz]);
                    if(iOrt > -1 && row[iOrt]) addressParts.push(row[iOrt]);
                }
                const fullAddress = addressParts.join(', ');
                if (name && !db.customers.some(x => x.name === name)) {
                    db.customers.push({
                        id: Date.now() + i, name: name, address: fullAddress, 
                        phone: iTel > -1 ? row[iTel] : "", nr: iNr > -1 ? row[iNr] : "",
                        route: iTour > -1 ? row[iTour] : "", category: 'C', status: 'aktiv', 
                        products: '', reports: [], nextAppointment: '', visitInterval: 4, tasks: []
                    });
                    count++;
                }
            }
            save(); alert(count + " Kunden importiert!"); showHome();
        };
    }

    async function processOCR(input) {
        const file = input.files[0];
        if(!file) return;
        const status = document.getElementById('ocrStatus');
        status.innerText = "Bild wird verarbeitet...";
        
        const reader = new FileReader();
        reader.onload = (e) => {
            document.getElementById('ocr-preview').src = e.target.result;
            document.getElementById('ocr-preview').style.display = 'block';
            window.currentOcrImage = e.target.result; 
        };
        reader.readAsDataURL(file);
        
        try {
            const worker = await Tesseract.createWorker('deu');
            status.innerText = "Lese Zahlen & Text...";
            const ret = await worker.recognize(file);
            const text = ret.data.text;
            const lines = ret.data.lines.map(l => l.text.trim()).filter(l => l.length > 2);
            
            if(lines.length > 0) document.getElementById('exp-note').value = lines[0];

            const dateMatch = text.match(/(\d{2})[\.\/-](\d{2})[\.\/-](\d{2,4})/);
            if(dateMatch) {
                let y = dateMatch[3];
                if(y.length === 2) y = "20" + y;
                document.getElementById('exp-date').value = `${y}-${dateMatch[2]}-${dateMatch[1]}`;
            }

            let maxVal = 0.0;
            const currentYear = new Date().getFullYear();
            
            lines.forEach(l => {
                const numbers = l.match(/[0-9]+[,.][0-9]{2}\b/g);
                if(numbers) {
                    numbers.forEach(numStr => {
                        let cleanStr = numStr.replace(/\./g, 'X').replace(/,/g, '.').replace(/X/g, ''); 
                        if(numStr.includes(';')) { cleanStr = numStr.replace(/\./g, '').replace(',', '.'); }
                        
                        const val = parseFloat(cleanStr);
                        if(!isNaN(val)) {
                            if(val >= currentYear -1 && val <= currentYear + 1) {} 
                            else { if(val > maxVal) maxVal = val; }
                        }
                    });
                }
            });
            
            if(maxVal > 0) document.getElementById('exp-amount').value = maxVal.toFixed(2);

            const t = text.toLowerCase();
            const cat = document.getElementById('exp-cat');
            if(t.includes('tank') || t.includes('liter') || t.includes('diesel') || t.includes('super') || t.includes('shell') || t.includes('aral')) cat.value = 'Tanken';
            else if(t.includes('park') || t.includes('ticket')) cat.value = 'Parken';
            else if(t.includes('hotel') || t.includes('zimmer')) cat.value = 'Hotel';
            else if(t.includes('burger') || t.includes('mcdonald') || t.includes('essen') || t.includes('trinken')) cat.value = 'Verpflegung';
            
            status.innerText = "Scan fertig!";
            await worker.terminate();
        } catch(e) {
            status.innerText = "Fehler: " + e.message;
        }
    }

            const c=missing[i];

            try{
                const r=await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(c.address)}`);
                const d=await r.json();
                if(d&&d[0]){c.lat=d[0].lat;c.lon=d[0].lon;}

        document.getElementById('stopGeoBtn').style.display='none';
        showMap();

    function generateReportPDF(range){

                    let include=false;
                    if(range==='day'&&r.date===dateStr) include=true;
                    if(range==='week'){
                        const diff=(today-repDate)/(1000*60*60*24);
                        if(diff<=7&&diff>=0) include=true;
                    }
                    if(include) reportData.push({...r, customerName:c.name, rawDate: repDate});
                }
            });
        });

        if(reportData.length===0) return alert("Keine Berichte gefunden.");

        reportData.sort((a,b) => a.rawDate - b.rawDate);

        let html=`<div class="no-print" style="margin-bottom:20px;"><button class="btn btn-primary" data-action="printPage">Drucken</button> <button class="btn btn-secondary" data-action="showHome" data-args="">Zurück</button></div><h1>${range==='day'?'Tagesbericht':'Wochenbericht'}</h1>`;

        });
        
        document.getElementById('content').innerHTML=html;
    }

    function addTask(id) { const t=document.getElementById('newT').value; const d=document.getElementById('newTDate').value; if(!t)return; db.customers.find(x=>x.id===id).tasks.push({text:t, done:false, dueDate:d}); save(); showDetail(id); }
    function toggleTask(id, idx) { const t=db.customers.find(x=>x.id===id).tasks[idx]; t.done=!t.done; save(); showDetail(id); }
    function delTask(id, idx) { db.customers.find(x=>x.id===id).tasks.splice(idx,1); save(); showDetail(id); }
    function addRep(id) { const t=document.getElementById('repTxt').value; const dInput=document.getElementById('repDate').value; const f=document.getElementById('repImg').files[0]; if(!t && !f) return; let dateStr = new Date().toLocaleDateString('de-DE'); if(dInput) { const [y,m,d] = dInput.split('-'); dateStr = `${d}.${m}.${y}`; } const sR=(img)=>{ db.customers.find(x=>x.id===id).reports.unshift({date:dateStr, text:t, img:img}); save(); showDetail(id); }; if(f){ const r=new FileReader(); r.onload=e=>{ const i=new Image(); i.onload=()=>{ const c=document.createElement('canvas'); const x=c.getContext('2d'); const s=600/i.width; c.width=600; c.height=i.height*s; x.drawImage(i,0,0,c.width,c.height); sR(c.toDataURL('image/jpeg',0.6)); }; i.src=e.target.result; }; r.readAsDataURL(f); } else sR(null); }
    function editRep(cid, rid) { const c=db.customers.find(x=>x.id===cid); const r=c.reports[rid]; const newTxt = prompt("Text bearbeiten:", r.text); if(newTxt !== null) { const newDate = prompt("Datum (TT.MM.JJJJ):", r.date); if(newDate) { r.text = newTxt; r.date = newDate; save(); showDetail(cid); } } }
    function togTour(id){if(db.tour.includes(id))db.tour=db.tour.filter(x=>x!==id);else db.tour.push(id);save();showDetail(id);}
    
    function showForm(id=null){

        document.getElementById('content').innerHTML=`
        <div style="max-width:600px; margin:0 auto;">

    function saveData(id){
        const n=document.getElementById('f_name').value;
        if(!n)return alert("Name fehlt");
        const d={
            id:id||Date.now(),name:n,
            nr:document.getElementById('f_nr').value,
            route:document.getElementById('f_route').value,
            category:document.getElementById('f_cat').value,

            visitInterval:4, 
            tasks:id?db.customers.find(x=>x.id===id).tasks:[]
        };

    async function optTour(){if(!db.home||db.tour.length<2)return alert("Brauche Start und >2 Kunden");document.getElementById('loader').style.display='flex';const getC=async(a)=>{try{const r=await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(a)}`);const d=await r.json();return d[0]?{lat:d[0].lat,lon:d[0].lon}:null;}catch(e){return null;}};const start=await getC(db.home);if(!start){document.getElementById('loader').style.display='none';return alert("Start nicht gefunden");}let pts=[];for(let id of db.tour){const c=db.customers.find(x=>x.id===id);const co=await getC(c.address);if(co)pts.push({id,co});}let sorted=[],cur=start;while(pts.length){pts.sort((a,b)=>(Math.pow(a.co.lat-cur.lat,2)+Math.pow(a.co.lon-cur.lon,2))-(Math.pow(b.co.lat-cur.lat,2)+Math.pow(b.co.lon-cur.lon,2)));const n=pts.shift();sorted.push(n.id);cur=n.co;}db.tour=sorted;save();document.getElementById('loader').style.display='none';showTour();}

    async function downloadBackup() {
        const now = new Date();
        const ts = now.getFullYear() + '-' +
                   String(now.getMonth()+1).padStart(2,'0') + '-' +
                   String(now.getDate()).padStart(2,'0') + '_' +
                   String(now.getHours()).padStart(2,'0') + '-' +
                   String(now.getMinutes()).padStart(2,'0') + '-' +
                   String(now.getSeconds()).padStart(2,'0');
        const filename = `crm_backup_${ts}.json`;
        const jsonStr = JSON.stringify(db, null, 2);

        if (window.showSaveFilePicker) {
            try {
                const handle = await window.showSaveFilePicker({
                    suggestedName: filename,
                    types: [{ description: 'JSON Database', accept: {'application/json': ['.json']} }],
                });
                const writable = await handle.createWritable();
                await writable.write(jsonStr);
                await writable.close();
                alert("Backup erfolgreich gespeichert!");
                return;
            } catch (err) {
                if (err.name !== 'AbortError') console.error(err);
                return; 
            }
        }

        const blob = new Blob([jsonStr], {type: "application/json"});
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
    }

  if(!db) db = {};
  if(!db.customers) db.customers = [];

  if(!db.events) db.events = [];
  if(!db.security) db.security = { pinEnabled:false, pinHash:'' };

  db.customers.forEach(c=>{
    if(!c.tags) c.tags = [];

    if(!c.checklist) c.checklist = [];
  });

-------------------------------- */
function isPinLocked(){
  try{
    if(!db.security || !db.security.pinEnabled || !db.security.pinHash) return false;
    return sessionStorage.getItem(SESSION_UNLOCK_KEY) !== '1';
  }catch(e){ return false; }
}

function showPinOverlay(){
  const o = document.getElementById('pinOverlay');
  const i = document.getElementById('pinInput');
  const msg = document.getElementById('pinMsg');
  if(msg){ msg.style.display='none'; msg.textContent=''; }
  if(o){ o.style.display='flex'; }
  setTimeout(()=>{ if(i){ i.value=''; i.focus(); } }, 50);
}

function hidePinOverlay(){
  const o = document.getElementById('pinOverlay');
  if(o) o.style.display='none';
}

async function sha256Hex(str){
  const enc = new TextEncoder();
  const data = enc.encode(str);
  const hash = await crypto.subtle.digest('SHA-256', data);
  return Array.from(new Uint8Array(hash)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

async function unlockWithPin(){
  const i = document.getElementById('pinInput');
  const msg = document.getElementById('pinMsg');
  const pin = (i?.value || '').trim();
  if(!pin){ if(msg){ msg.textContent='Bitte PIN eingeben.'; msg.style.display='block'; } return; }
  const h = await sha256Hex(pin);
  if(h === db.security.pinHash){
    sessionStorage.setItem(SESSION_UNLOCK_KEY,'1');
    hidePinOverlay();
    showHome();
  } else {
    if(msg){ msg.textContent='Falsche PIN.'; msg.style.display='block'; }
    if(i) i.select();
  }
}

function pinOverlayHelp(){
  alert("PIN vergessen?\n\nDa alles offline ist, gibt es keinen Server-Reset.\nWenn du noch Zugriff auf ein Backup hast: Backup importieren.\nOder in localStorage den Key '"+DB_KEY+"' löschen (Achtung: alle Daten weg).");
}

document.addEventListener('keydown', (e)=>{

    if(o && o.style.display !== 'none'){
      unlockWithPin();
    }
  }
});

      });

        if(hr.includes(q)) hits.push({type:'Bericht', title:`${c.name} • ${r.date}`, sub:(r.text||'').slice(0,120), action:`data-action="showDetail" data-args="${c.id}"`});

      if(he.includes(q)) hits.push({type:'Spese', title:`${e.note||'Spese'} • ${parseFloat(e.amount||0).toFixed(2)} €`, sub:e.date||'', action:`data-action="nav" data-args="'expenses', null"`});

function initExpenseMonthSelect(){
  const sel = document.getElementById('expMonthSel');
  if(!sel) return;
  const months = {};
  (db.expenses||[]).forEach(e=>{
    const d = parseExpenseDate(e.date);
    if(!d) return;
    const key = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
    months[key] = true;
  });
  const keys = Object.keys(months).sort().reverse();
  const cur = new Date();
  const curKey = `${cur.getFullYear()}-${String(cur.getMonth()+1).padStart(2,'0')}`;
  if(!keys.includes(curKey)) keys.unshift(curKey);
  sel.innerHTML = keys.map(k=>{
    const [y,m] = k.split('-');
    return `<option value="${k}">${m}.${y}</option>`;
  }).join('');
}

function parseExpenseDate(deStr){
  if(!deStr) return null;
  // unterstützt "DD.MM.YYYY" oder ISO
  if(deStr.includes('.')){
    const p = deStr.split('.');
    if(p.length===3){
      const [dd,mm,yy]=p.map(x=>parseInt(x,10));
      if(!dd||!mm||!yy) return null;
      return new Date(yy, mm-1, dd);
    }
  }
  const d = new Date(deStr);
  return isNaN(d.getTime()) ? null : d;
}

function renderExpenseChart(){
  const sel = document.getElementById('expMonthSel');
  const c = document.getElementById('expChart');
  const sumEl = document.getElementById('expChartSum');
  if(!sel || !c || !c.getContext) return;

  const key = sel.value;
  const [yS,mS] = key.split('-');
  const y = parseInt(yS,10), m = parseInt(mS,10);

  const cats = {};
  let total = 0;
  (db.expenses||[]).forEach(e=>{
    const d = parseExpenseDate(e.date);
    if(!d) return;
    if(d.getFullYear()!==y || (d.getMonth()+1)!==m) return;
    const cat = (e.category||'Sonstiges');
    const amt = parseFloat(e.amount||0) || 0;
    cats[cat] = (cats[cat]||0) + amt;
    total += amt;
  });

  const entries = Object.entries(cats).sort((a,b)=>b[1]-a[1]);
  const ctx = c.getContext('2d');
  ctx.clearRect(0,0,c.width,c.height);

  // simple Bar-Chart (offline, ohne libs)
  const padL=40, padT=20, padB=30, padR=20;
  const w=c.width-padL-padR, h=c.height-padT-padB;
  const max = Math.max(...entries.map(e=>e[1]), 1);

  ctx.font='12px system-ui';
  ctx.fillText('€', 10, 18);

  entries.slice(0,10).forEach((e,ix)=>{
    const x = padL + (w/10)*ix + 6;
    const barW = (w/10) - 12;
    const barH = Math.round((e[1]/max)*h);
    const y0 = padT + (h - barH);
    ctx.fillRect(x, y0, barW, barH);
    ctx.save();
    ctx.translate(x, padT+h+14);
    ctx.rotate(-Math.PI/6);
    ctx.fillText(e[0].slice(0,10), 0, 0);
    ctx.restore();
  });

  if(sumEl) sumEl.textContent = `Summe ${m}.${y}: ${total.toFixed(2)} € (${entries.length} Kategorien)`;
}

function saveTags(id){
  const c = db.customers.find(x=>x.id===id);
  if(!c) return;
  const inp = document.getElementById('tagsInput');
  const raw = (inp?.value || '').split(',').map(x=>x.trim()).filter(Boolean);
  c.tags = Array.from(new Set(raw));
  save();

}

function addDocFromInput(id, input){
  const c = db.customers.find(x=>x.id===id);
  if(!c) return;
  const f = input?.files?.[0];
  if(!f) return;
  // Warnung bei großen Dateien (LocalStorage Limit)
  if(f.size > 3_000_000){
    if(!confirm("Datei ist größer als ~3MB. LocalStorage kann voll laufen.\nTrotzdem speichern?")) return;
  }
  const r = new FileReader();
  r.onload = e=>{
    const dataUrl = e.target.result;
    const doc = { id: String(Date.now())+Math.random().toString(16).slice(2), name: f.name, type: f.type || 'application/octet-stream', data: dataUrl, ts: Date.now() };
    c.docs = c.docs || [];
    c.docs.unshift(doc);
    save();
    showDetail(id);
  };
  r.readAsDataURL(f);
}

function openDoc(id, docId){
  const c = db.customers.find(x=>x.id===id);
  const d = (c?.docs||[]).find(x=>x.id===docId);
  if(!d) return;
  const w = window.open('', '_blank', 'noopener');
  if(!w) return alert('Popup blockiert. Bitte Popups erlauben.');
  // simple viewer
  w.document.write(`<title>${escapeHtml(d.name||'Dokument')}</title>`);
  if((d.type||'').startsWith('image/')){
    w.document.write(`<img src="${d.data}" style="max-width:100%; height:auto;">`);
  } else if((d.type||'') === 'application/pdf'){
    w.document.write(`<iframe src="${d.data}" style="width:100%; height:100vh; border:0;"></iframe>`);
  } else {
    w.document.write(`<a download="${escapeHtml(d.name||'download')}" href="${d.data}">Download</a>`);
  }
}

function delDoc(id, docId){
  const c = db.customers.find(x=>x.id===id);
  if(!c) return;
  if(!confirm('Dokument löschen?')) return;
  c.docs = (c.docs||[]).filter(x=>x.id!==docId);
  save();
  showDetail(id);
}

function addChecklist(id){
  const c = db.customers.find(x=>x.id===id);
  const inp = document.getElementById('chkNew');
  const txt = (inp?.value || '').trim();
  if(!c || !txt) return;
  c.checklist = c.checklist || [];

function toggleChecklist(id, ix){
  const c = db.customers.find(x=>x.id===id);
  if(!c || !c.checklist || !c.checklist[ix]) return;
  c.checklist[ix].done = !c.checklist[ix].done;
  save();
  showDetail(id);
}

function delChecklist(id, ix){
  const c = db.customers.find(x=>x.id===id);
  if(!c || !c.checklist) return;
  c.checklist.splice(ix,1);
  save();

function clearChecklist(id){

  if(!confirm('Checkliste leeren?')) return;

  save();
  showDetail(id);
}

function reportFromChecklist(id){
  const c = db.customers.find(x=>x.id===id);
  if(!c) return;
  const items = (c.checklist||[]);
  if(!items.length) return alert('Checkliste ist leer.');
  const lines = items.map(it=>`${it.done ? '[x]' : '[ ]'} ${it.text}`);
  const txt = `Besuch – Checkliste\n\n` + lines.join('\n');
  // Report hinzufügen
  const d = new Date().toLocaleDateString('de-DE');
  c.reports = c.reports || [];
  c.reports.unshift({date:d, text:txt, img:null});
  save();
  showDetail(id);
}

function loadSnapshots(){
  try { return JSON.parse(localStorage.getItem(SNAP_KEY) || '[]'); } catch { return []; }
}
function saveSnapshots(snaps){
  try { localStorage.setItem(SNAP_KEY, JSON.stringify(snaps)); } catch {}
}
function createSnapshot(){
  const label = (document.getElementById('snapLabel')?.value || '').trim();
  const snaps = loadSnapshots();
  const s = { id: String(Date.now())+Math.random().toString(16).slice(2), ts: Date.now(), label: label || 'Snapshot', data: JSON.stringify(db) };
  snaps.unshift(s);
  // Limit (z.B. 25) um Storage zu schonen
  const limited = snaps.slice(0,25);
  saveSnapshots(limited);
  alert('Snapshot erstellt.');
  showTools();
}
function restoreSnapshot(id){
  const snaps = loadSnapshots();
  const s = snaps.find(x=>x.id===id);
  if(!s) return alert('Snapshot nicht gefunden.');
  if(!confirm('Snapshot wiederherstellen? Aktueller Stand geht verloren (aber du kannst vorher einen Snapshot erstellen).')) return;
  try{
    db = JSON.parse(s.data);
    ensureNewSchema();
    save();
    alert('Wiederhergestellt.');
    showHome();
  }catch(e){
    console.error(e);
    alert('Snapshot beschädigt.');
  }
}
function deleteSnapshot(id){
  if(!confirm('Snapshot löschen?')) return;
  const snaps = loadSnapshots().filter(x=>x.id!==id);
  saveSnapshots(snaps);
  showTools();
}

<script>
/* ============================================================
   ACTION DISPATCHER (Fix)
   - sorgt dafür, dass Buttons mit data-action in jedem Browser
     zuverlässig funktionieren.
   - Übergibt automatisch das geklickte Element an Handler, die
     ein Element erwarten (z.B. setCalView, setMonth, ...).
   - Stoppt alte/defekte Handler (capture + stopPropagation).
   ============================================================ */
(function(){
  // parseArgs fallback, falls die Hauptfunktion aus irgendeinem Grund nicht im Scope ist
  function parseArgsFallback(s){
    if(!s) return [];
    try { return JSON.parse(s); } catch {}
    // Komma-separiert: 1,2,"x"
    return String(s).split(',').map(x=>x.trim()).filter(Boolean).map(x=>{
      if(x === 'this') return null;
      if(x === 'true') return true;
      if(x === 'false') return false;
      const n = Number(x);
      if(!Number.isNaN(n) && x !== '') return n;
      return x.replace(/^["']|["']$/g,'');
    });
  }

  function getArgs(el){
    const raw = el.getAttribute('data-args') || '';
    try {
      if (typeof window.parseArgs === 'function') return window.parseArgs(raw);
    } catch {}
    return parseArgsFallback(raw);
  }

  document.addEventListener('click', function(ev){
    const el = ev.target && ev.target.closest ? ev.target.closest('[data-action]') : null;
    if(!el) return;

    // Wir übernehmen die Aktion komplett, damit kein anderer (fehlerhafter)
    // Listener sie nochmal ausführt.
    ev.preventDefault();
    ev.stopPropagation();

    const action = el.getAttribute('data-action');
    const fn = window[action];

    if (typeof fn !== 'function') {
      // Soft fail: nicht hart crashen
      try { alert(`Fehler bei Action: ${action}\nFunktion nicht gefunden.`); } catch {}
      return;
    }

    let args = getArgs(el);

    // "this" Platzhalter (als null) durch das Element ersetzen
    args = (args || []).map(a => (a === null ? el : a));

    // Wenn keine Args angegeben sind, aber die Funktion ein Element erwartet:
    // Konvention in deinem Code: ( _unused, el )
    if (args.length === 0) {
      // setCalView/setMonth/... brauchen el als 2. Parameter
      fn(undefined, el);
      return;
    }

    // Wenn Args vorhanden sind, aber kein Element mitgegeben wurde und fn erwartet 2+:
    if (fn.length >= 2 && args.length === 1) {
      fn(args[0], el);
      return;
    }

    fn.apply(null, args);
  }, true); // capture => läuft vor anderen Listenern

  // Export/Bind: manche Funktionen können (je nach Block-Scope) nicht global sein.
  // Wir binden sie hier explizit auf window, falls vorhanden.
  try {
    if (typeof showAgenda === 'function') window.showAgenda = showAgenda;
    if (typeof showSearch === 'function') window.showSearch = showSearch;
    if (typeof showTools === 'function') window.showTools = showTools;
  } catch {}
})();
</script>
