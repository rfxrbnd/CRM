<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AD Board 2026 - Modern Edition</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js'></script>

    <style>
        /* --- 1. MODERN THEME VARIABLES --- */
        :root {
            /* Palette: Modern Slate & Amber */
            --primary: #F59E0B;        /* Modernes Gold/Amber */
            --primary-hover: #D97706;
            --primary-fg: #ffffff;
            
            --bg-body: #F3F4F6;        /* Helles, kühles Grau */
            --bg-surface: #FFFFFF;
            --bg-sidebar: #FFFFFF;
            
            --text-main: #111827;      /* Fast Schwarz */
            --text-muted: #6B7280;     /* Mittelgrau */
            
            --border: #E5E7EB;         /* Sehr helles Grau für feine Linien */
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            
            --radius-md: 8px;
            --radius-lg: 16px;
            
            /* Status Colors */
            --success: #10B981;
            --danger: #EF4444;
            --info: #3B82F6;
            
            /* Components */
            --input-bg: #F9FAFB;
            --input-focus-ring: rgba(245, 158, 11, 0.3);
        }

        /* --- 2. GLOBAL RESET & TYPOGRAPHY --- */
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
        
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0; 
            display: flex; 
            height: 100vh; 
            background: var(--bg-body); 
            color: var(--text-main); 
            overflow: hidden; 
        }

        /* --- 3. UI COMPONENTS --- */
        
        /* Buttons */
        .btn { 
            display: inline-flex; align-items: center; justify-content: center; 
            padding: 10px 18px; border-radius: var(--radius-md); 
            font-size: 14px; font-weight: 600; cursor: pointer; 
            border: 1px solid transparent; gap: 8px; transition: all 0.2s ease; 
            text-decoration: none !important; user-select: none;
        }
        .btn:active { transform: scale(0.97); }
        
        .btn-primary { background: var(--primary); color: var(--primary-fg); box-shadow: var(--shadow-sm); }
        .btn-primary:hover { background: var(--primary-hover); }
        
        .btn-secondary { background: var(--bg-surface); border: 1px solid var(--border); color: var(--text-main); }
        .btn-secondary:hover { background: #F9FAFB; border-color: #D1D5DB; }
        
        .btn-danger { background: #FEF2F2; color: var(--danger); border: 1px solid #FEE2E2; }
        .btn-danger:hover { background: #FEE2E2; }
        
        .btn-success { background: #ECFDF5; color: var(--success); border: 1px solid #D1FAE5; }
        
        .btn-full { width: 100%; }

        /* Inputs */
        input, select, textarea { 
            width: 100%; padding: 12px 16px; 
            border: 1px solid transparent; 
            background: var(--input-bg); 
            border-radius: var(--radius-md); 
            font-size: 14px; font-family: inherit; color: var(--text-main);
            transition: all 0.2s; margin-bottom: 15px;
        }
        input:focus, select:focus, textarea:focus { 
            background: #fff; border-color: var(--primary); 
            box-shadow: 0 0 0 3px var(--input-focus-ring); 
        }
        label { 
            display: block; margin-bottom: 6px; 
            font-size: 11px; font-weight: 700; letter-spacing: 0.5px;
            color: var(--text-muted); text-transform: uppercase; 
        }

        /* Cards */
        .card { 
            background: var(--bg-surface); 
            border: 1px solid var(--border); 
            border-radius: var(--radius-lg); 
            padding: 24px; 
            margin-bottom: 24px; 
            box-shadow: var(--shadow-sm); 
        }

        /* Lists & Tables */
        .cust-row { 
            display: flex; align-items: center; padding: 16px; 
            background: #fff; border-bottom: 1px solid var(--border); 
            cursor: pointer; transition: background 0.15s; 
            justify-content: space-between; 
        }
        .cust-row:hover { background: #F9FAFB; }
        .cust-row.selected { background: #FFFBEB; border-left: 3px solid var(--primary); }
        
        .cat-badge { padding: 4px 10px; border-radius: 99px; font-size: 11px; font-weight: 700; color: #fff; min-width: 28px; text-align: center; display: inline-block;}
        .cat-A { background: #F59E0B; }
        .cat-B { background: #3B82F6; }
        .cat-C { background: #9CA3AF; }

        /* --- 4. LAYOUT SYSTEM --- */
        #sidebar { 
            width: 280px; background: var(--bg-sidebar); border-right: 1px solid var(--border); 
            display: flex; flex-direction: column; z-index: 50; flex-shrink: 0; 
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); 
        }
        .nav-menu { padding: 20px; display: flex; flex-direction: column; gap: 4px; overflow-y: auto; flex: 1;}
        .nav-item { 
            display: flex; align-items: center; gap: 12px; padding: 12px 16px; 
            border-radius: var(--radius-md); cursor: pointer; 
            color: var(--text-muted); font-size: 14px; font-weight: 500; 
            background: transparent; border: none; width: 100%; text-align: left; 
        }
        .nav-item:hover { background: #F3F4F6; color: var(--text-main); }
        .nav-item.active { background: #FFFBEB; color: var(--primary-hover); font-weight: 700; }

        #main { flex: 1; overflow-y: auto; position: relative; scroll-behavior: smooth; }
        .content-wrap { max-width: 1100px; margin: 0 auto; padding: 40px; padding-bottom: 120px; }

        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
        /* Custom Grid for Detail View Input Bar */
        .grid-detail-bar { display: grid; grid-template-columns: 1.2fr 1.5fr 0.6fr 1fr; gap: 15px; align-items: end; }

        /* --- 5. SPECIFIC MODULES --- */
        /* Detail View Layout Fix */
        .detail-layout { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; align-items: stretch; }
        
        /* Calendar */
        .cal-layout { display: grid; grid-template-columns: 260px 1fr; gap: 24px; height: calc(100vh - 140px); min-height: 600px; }
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); background: var(--border); gap: 1px; flex: 1; overflow-y: auto; }
        .cal-day { background: #fff; min-height: 100px; padding: 8px; display: flex; flex-direction: column; gap: 4px; }
        .cal-day.today { background: #FFFBEB; }
        .cal-event { background: var(--primary); color: #fff; padding: 4px 8px; border-radius: 4px; font-size: 11px; cursor: pointer; margin-top: 2px; box-shadow: 0 1px 2px rgba(0,0,0,0.1); }
        .cal-event.manual { background: var(--info); }

        /* Loader */
        #loader { position: fixed; inset: 0; background: rgba(255,255,255,0.9); z-index: 99999; display: flex; flex-direction: column; justify-content: center; align-items: center; backdrop-filter: blur(5px); }
        .spinner { width: 40px; height: 40px; border: 3px solid #E5E7EB; border-top-color: var(--primary); border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        /* Helpers */
        h1 { font-size: 26px; font-weight: 800; letter-spacing: -0.5px; margin: 0 0 24px 0; color: var(--text-main); }
        h2 { font-size: 18px; font-weight: 700; margin-bottom: 16px; }
        .no-print { }
        #menu-toggle { display: none; position: fixed; top: 20px; right: 20px; z-index: 100; background: #fff; width: 48px; height: 48px; border-radius: 50%; border: 1px solid var(--border); box-shadow: var(--shadow-md); font-size: 24px; cursor: pointer; }

        /* Responsive */
        @media (max-width: 850px) {
            #sidebar { position: fixed; height: 100%; transform: translateX(-100%); width: 85%; box-shadow: 20px 0 50px rgba(0,0,0,0.1); }
            #sidebar.open { transform: translateX(0); }
            #menu-toggle { display: flex; align-items: center; justify-content: center; }
            .cal-layout, .grid-2, .grid-3, .grid-detail-bar, .detail-layout { grid-template-columns: 1fr; display: flex; flex-direction: column; height: auto; }
            .content-wrap { padding: 20px; }
            .cal-pool { height: 180px; margin-bottom: 20px; }
            .cal-main { height: 500px; }
        }
        
        @media print {
            #sidebar, #menu-toggle, .no-print, .btn, .nav-menu, .float-bar { display: none !important; }
            #main { padding: 0; overflow: visible; height: auto; }
            .card { box-shadow: none; border: none; padding: 0; margin-bottom: 30px; border-bottom: 1px solid #ccc; }
        }
    </style>
</head>
<body>

<div id="loader">
    <div class="spinner"></div>
    <div id="loader-text" style="margin-top:15px; font-weight:600; font-size:14px; color:var(--text-muted);">System wird geladen...</div>
    <button class="btn btn-danger" id="stopGeoBtn" style="margin-top:20px; display:none;" onclick="stopGeocoding=true">Vorgang stoppen</button>
</div>

<button id="menu-toggle" onclick="toggleSidebar()">☰</button>

<div id="timeModal" class="modal-overlay" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.4); backdrop-filter:blur(4px); z-index:2000; align-items:center; justify-content:center;">
    <div class="card" style="width:90%; max-width:320px; margin:0;">
        <h2 style="text-align:center">Zeit wählen</h2>
        <input type="time" id="modalTime" value="09:00" style="font-size:24px; text-align:center; padding:10px; margin-bottom:20px;">
        <div class="grid-2">
            <button class="btn btn-primary btn-full" onclick="confirmDrop()">Speichern</button>
            <button class="btn btn-secondary btn-full" onclick="closeModal()">Abbrechen</button>
        </div>
    </div>
</div>

<div id="eventModal" class="modal-overlay" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.4); backdrop-filter:blur(4px); z-index:2000; align-items:center; justify-content:center;">
    <div class="card" style="width:90%; max-width:350px; margin:0;">
        <h2 style="text-align:center">Termin</h2>
        <input type="hidden" id="evtId">
        <label>Titel / Art</label>
        <div style="display:flex; gap:10px; margin-bottom:10px;">
            <input id="evtTitle" placeholder="Titel" style="margin:0;">
            <select style="width:60px; margin:0;" onchange="document.getElementById('evtTitle').value=this.value">
                <option value="">...</option><option>Büro</option><option>Meeting</option><option>Privat</option><option>Arzt</option><option>Urlaub</option>
            </select>
        </div>
        <div class="grid-2">
            <div><label>Datum</label><input type="date" id="evtDate" style="margin:0;"></div>
            <div><label>Von</label><input type="time" id="evtStart" value="09:00" style="margin:0;"></div>
        </div>
        <div style="margin-top:15px;"><label>Bis</label><input type="time" id="evtEnd" value="10:00" style="margin:0;"></div>
        <div class="grid-2" style="margin-top:20px;">
            <button class="btn btn-success btn-full" onclick="saveManualEvent()">Speichern</button>
            <button class="btn btn-danger btn-full" onclick="delManualEvent()" id="btnDelEvt" style="display:none;">Löschen</button>
        </div>
        <button class="btn btn-secondary btn-full" style="margin-top:10px;" onclick="document.getElementById('eventModal').style.display='none'">Abbrechen</button>
    </div>
</div>

<div id="sidebar">
    <div class="logo-area">
        <img id="sidebar-logo" src="" style="max-height:40px; display:none;" alt="Logo">
        <div id="text-logo" style="font-weight:800; font-size:18px;">Raphaels CRM</div>
    </div>
    <div class="nav-menu">
        <button class="nav-item active" onclick="nav('home', this)">🏠 Dashboard</button>
        <button class="nav-item" onclick="nav('customers', this)">👥 Kunden</button>
        <button class="nav-item" onclick="nav('expenses', this)">💶 Spesen</button>
        <button class="nav-item" onclick="nav('map', this)">🗺️ Karte</button>
        <button class="nav-item" onclick="nav('calendar', this)">📅 Kalender</button>
        <button class="nav-item" onclick="nav('tour', this)">🚗 Tour Planer</button>
        <button class="nav-item" onclick="nav('routes', this)">📂 Routen</button>
    </div>
    <div style="padding:20px; border-top:1px solid var(--border); font-size:11px; color:var(--text-muted); text-align:center;">
        v124 &bull; 2026 Edition
    </div>
</div>

<div id="main">
    <div id="content" class="content-wrap"></div>
</div>

<script>
    // --- 1. CONFIG & STATE ---
    const DB_KEY = 'raphael_crm_v124_clean';
    const DEFAULT_LOGO = "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23F59E0B' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Crect x='2' y='7' width='20' height='14' rx='2' ry='2'/%3E%3Cpath d='M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16'/%3E%3C/svg%3E";
    
    let db = { customers: [], tour: [], home: "", expenses: [], logo: null, events: [] };
    let currentCalDate = new Date();
    let calView = 'month'; 
    let dragId = null, dragTargetDate = null;
    let selectMode = false;
    let selectedIds = new Set();
    let viewState = { sort: 'name', search: '', filterRoute: null };
    let mapInstance = null; 
    let editingExpenseId = null;
    window.currentOcrImage = null; 
    let stopGeocoding = false;

    // --- 2. INITIALIZATION ---
    window.onload = () => {
        try {
            // Load DB
            const current = JSON.parse(localStorage.getItem(DB_KEY));
            if (current) {
                db = current;
            } else {
                // Try Migration from v122 or v123
                const legacy = JSON.parse(localStorage.getItem('raphael_crm_v122_revenue')) || JSON.parse(localStorage.getItem('raphael_crm_v121_visualcat'));
                if(legacy) { db = legacy; save(); }
            }

            // Defaults
            if(!db.expenses) db.expenses = [];
            if(!db.events) db.events = [];
            if(!db.customers) db.customers = [];

            // Ensure compatibility
            db.customers.forEach(c => {
                if(!c.reports) c.reports = [];
                if(!c.tasks) c.tasks = [];
                if(!c.nextAppointment) c.nextAppointment = "";
                if(!c.visitInterval) c.visitInterval = 4;
                if(c.products === undefined) c.products = ""; // Revenue field
            });

            updateLogoUI();
            showHome();
        } catch(e) {
            console.error(e);
            alert("System-Start Fehler: " + e.message);
        } finally {
            document.getElementById('loader').style.display = 'none';
        }
    };

    function save() { 
        localStorage.setItem(DB_KEY, JSON.stringify(db)); 
    }

    function updateLogoUI() {
        const img = document.getElementById('sidebar-logo');
        const txt = document.getElementById('text-logo');
        if(db.logo) { 
            img.src = db.logo; 
            img.style.display = 'inline-block'; 
            txt.style.display = 'none'; 
        } else { 
            img.src = DEFAULT_LOGO; 
            img.style.display = 'inline-block'; 
            txt.style.display = 'none'; 
        }
    }

    // --- 3. NAVIGATION ---
    function nav(page, el) {
        document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
        if(el) el.classList.add('active');
        if(window.innerWidth <= 850) toggleSidebar();
        
        // Reset States
        selectMode = false; 
        selectedIds.clear();
        viewState.filterRoute = null; 
        if(mapInstance) { mapInstance.remove(); mapInstance = null; }

        // Router
        switch(page) {
            case 'home': showHome(); break;
            case 'map': showMap(); break;
            case 'calendar': showCalendar(); break;
            case 'customers': showCustomers(); break;
            case 'tour': showTour(); break;
            case 'routes': showRoutes(); break;
            case 'expenses': showExpenses(); break;
        }
    }

    function toggleSidebar() { 
        document.getElementById('sidebar').classList.toggle('open'); 
    }

    // --- 4. DATA IMPORT/EXPORT ---
    function importCSV(input) {
        const f = input.files[0];
        if(!f) return;
        const r = new FileReader();
        r.readAsText(f, 'UTF-8');
        r.onload = e => {
            const text = e.target.result;
            const lines = text.split(/\r\n|\n/).filter(line => line.trim() !== '');
            if(lines.length < 2) return alert("Datei leer oder ungültig");
            
            const firstLine = lines[0];
            const sep = firstLine.includes(';') ? ';' : ','; 
            const headers = firstLine.split(sep).map(h => h.replace(/"/g, '').trim().toLowerCase());
            
            const iName = headers.findIndex(h => h === 'name');
            const iStr = headers.findIndex(h => h.includes('straße') || h.includes('str'));
            const iPlz = headers.findIndex(h => h === 'plz');
            const iOrt = headers.findIndex(h => h === 'ort');
            const iTel = headers.findIndex(h => h.includes('tel'));
            const iNr = headers.findIndex(h => h === 'nr' || h.includes('kundennummer'));
            const iTour = headers.findIndex(h => h === 'tour');

            if (iName === -1) return alert("Fehler: Spalte 'Name' nicht gefunden.");
            
            let count = 0;
            for (let i = 1; i < lines.length; i++) {
                const row = lines[i].split(sep).map(s => s.replace(/^"|"$/g, '').trim());
                const name = row[iName];
                let addressParts = [];
                
                if(iStr > -1 && row[iStr]) addressParts.push(row[iStr]);
                if(iPlz > -1 && row[iPlz] && iOrt > -1 && row[iOrt]) {
                    addressParts.push(row[iPlz] + " " + row[iOrt]);
                } else {
                    if(iPlz > -1 && row[iPlz]) addressParts.push(row[iPlz]);
                    if(iOrt > -1 && row[iOrt]) addressParts.push(row[iOrt]);
                }
                
                const fullAddress = addressParts.join(', ');
                
                if (name && !db.customers.some(x => x.name === name)) {
                    db.customers.push({
                        id: Date.now() + i, name: name, address: fullAddress, 
                        phone: iTel > -1 ? row[iTel] : "", nr: iNr > -1 ? row[iNr] : "",
                        route: iTour > -1 ? row[iTour] : "", category: 'C', status: 'aktiv', 
                        products: '', reports: [], nextAppointment: '', visitInterval: 4, tasks: []
                    });
                    count++;
                }
            }
            save(); alert(count + " Kunden importiert!"); showHome();
        };
    }

    async function downloadBackup() {
        const now = new Date();
        const ts = now.toISOString().replace(/[:.]/g, '-').slice(0,19);
        const filename = `crm_backup_${ts}.json`;
        const jsonStr = JSON.stringify(db, null, 2);

        if (window.showSaveFilePicker) {
            try {
                const handle = await window.showSaveFilePicker({
                    suggestedName: filename,
                    types: [{ description: 'JSON Database', accept: {'application/json': ['.json']} }],
                });
                const writable = await handle.createWritable();
                await writable.write(jsonStr);
                await writable.close();
                alert("Backup erfolgreich!");
                return;
            } catch (err) { if (err.name !== 'AbortError') console.error(err); return; }
        }
        
        const blob = new Blob([jsonStr], {type: "application/json"});
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
    }

    function importBackup(input){
        const f=input.files[0]; if(!f)return;
        const r=new FileReader();
        r.onload=e=>{
            try {
                db=JSON.parse(e.target.result);
                save(); alert("Backup erfolgreich geladen."); showHome();
            } catch(e) { alert("Datei beschädigt."); }
        };
        r.readAsText(f);
    }

    function uploadLogo(input) { 
        const f=input.files[0]; if(!f)return; 
        const r=new FileReader(); 
        r.onload=e=>{ 
            const img=new Image(); 
            img.onload=()=>{ 
                const cvs=document.createElement('canvas'); 
                const ctx=cvs.getContext('2d'); 
                const s=100/img.height; 
                cvs.height=100; cvs.width=img.width*s; 
                ctx.drawImage(img,0,0,cvs.width,cvs.height); 
                db.logo=cvs.toDataURL('image/png'); 
                save(); updateLogoUI(); 
            }; 
            img.src=e.target.result; 
        }; 
        r.readAsDataURL(f); 
    }

    // --- 5. VIEWS: DASHBOARD ---
    function showHome(){
        const today = new Date().toLocaleDateString('de-DE');
        const count = db.customers.length;
        const visited = db.customers.filter(c => c.reports && c.reports.some(r => r.date === today)).length;
        const openTasksCount = db.customers.reduce((sum, c) => sum + (c.tasks ? c.tasks.filter(t => !t.done).length : 0), 0);

        // Stats Logic
        let stats = {};
        for(let i=5; i>=0; i--){
            const d = new Date(); d.setMonth(d.getMonth()-i);
            const k = d.toLocaleString('de',{month:'short'});
            stats[k] = 0;
            db.customers.forEach(c => c.reports.forEach(r => {
                const[D,M,Y] = r.date.split('.');
                if(parseInt(M) == d.getMonth()+1 && parseInt(Y) == d.getFullYear()) stats[k]++;
            }));
        }
        const maxV = Math.max(...Object.values(stats)) || 1;
        const bars = Object.keys(stats).map(k => 
            `<div class="stat-bar" style="height:${(stats[k]/maxV)*100}%"><span class="stat-val">${stats[k]}</span><span class="stat-lbl">${k}</span></div>`
        ).join('');
        
        document.getElementById('content').innerHTML = `
        <h1>Dashboard</h1>
        <div class="grid-3">
            <div class="card" style="text-align:center;">
                <div style="font-size:36px; font-weight:800; color:var(--text-main);">${count}</div>
                <div style="font-size:13px; color:var(--text-muted); font-weight:600;">Kunden</div>
            </div>
            <div class="card" style="text-align:center;">
                <div style="font-size:36px; font-weight:800; color:var(--primary);">${visited}</div>
                <div style="font-size:13px; color:var(--text-muted); font-weight:600;">Heute besucht</div>
            </div>
            <div class="card" style="text-align:center; cursor:pointer; border:1px solid #FECACA;" onclick="showAllTasks()">
                <div style="font-size:36px; font-weight:800; color:var(--danger);">${openTasksCount}</div>
                <div style="font-size:13px; color:var(--text-muted); font-weight:600;">Offene Aufgaben</div>
            </div>
        </div>
        
        <div class="card">
            <h2>📈 Besuchstrend</h2>
            <div class="stat-container">${bars}</div>
        </div>

        <div class="grid-2">
            <div class="card">
                <h2>Schnellzugriff</h2>

    function showAllTasks() {
        const todayStr = new Date().toISOString().split('T')[0];
        let html = `
        <div class="no-print" style="margin-bottom:20px; display:flex; justify-content:space-between; align-items:center;">
            <h1>Offene Aufgaben</h1>
            <button class="btn btn-secondary" onclick="showHome()">← Zurück</button>
        </div>
        <div class="card">`;
        
        let count = 0;
        db.customers.forEach(c => {
            if(c.tasks && c.tasks.length > 0) {
                c.tasks.forEach((t, index) => {
                    if(!t.done) {
                        const isOverdue = t.dueDate && t.dueDate < todayStr;
                        html += `
                        <div class="global-task-row" style="display:flex; padding:15px; border-bottom:1px solid var(--border);">
                            <input type="checkbox" style="margin-right:15px; width:20px; height:20px;" onclick="toggleTaskGlobal(${c.id}, ${index})">
                            <div style="flex:1;">
                                <div style="font-weight:600; font-size:15px; ${isOverdue ? 'color:var(--danger);' : ''}">${t.text}</div>
                                <div style="font-size:12px; color:var(--text-muted); cursor:pointer; margin-top:4px;" onclick="showDetail(${c.id})">
                                    👤 ${c.name} ${t.dueDate ? ' &bull; 📅 ' + t.dueDate.split('-').reverse().join('.') : ''}
                                </div>
                            </div>
                        </div>`;
                        count++;
                    }
                });
            }
        });
        if(count === 0) html += '<div style="padding:40px; text-align:center; color:var(--text-muted);">Alles erledigt! 🎉</div>';
        html += '</div>';
        document.getElementById('content').innerHTML = html;
    }
    
    function toggleTaskGlobal(cid, tid) { 
        const c = db.customers.find(x => x.id === cid); 
        if(c && c.tasks[tid]) { 
            c.tasks[tid].done = true; 
            save(); showAllTasks(); 
        } 
    }

    function renderTable(){
        const s = viewState.search.toLowerCase();
        let list = db.customers;

        if (viewState.filterRoute) list = list.filter(c => c.route === viewState.filterRoute);
        if (s) {
            list = list.filter(c => 
                (c.name||'').toLowerCase().includes(s) || 
                (c.nr||'').toLowerCase().includes(s) || 
                (c.route||'').toLowerCase().includes(s) ||
                (c.address||'').toLowerCase().includes(s) ||
                (c.contact||'').toLowerCase().includes(s)
            );
        }

        if(viewState.sort==='route') list.sort((a,b)=>(a.route||'z').localeCompare(b.route||'z'));
        else if(viewState.sort==='status') list.sort((a,b)=>(getStatus(a)==='red'?-1:1));
        else list.sort((a,b)=>a.name.localeCompare(b.name));

        document.getElementById('tableContainer').innerHTML = list.map(c => {
            const isSelected = selectedIds.has(c.id);
            const clickAction = selectMode ? `toggleSelection(${c.id})` : `showDetail(${c.id})`;
            const badgeClass = c.category === 'A' ? 'cat-A' : (c.category === 'B' ? 'cat-B' : 'cat-C');
            
            return `
            <div class="cust-row ${isSelected?'selected':''}" onclick="${clickAction}">
                ${selectMode?`<div class="check-circle"></div>`:''}
                <div style="flex:1;">
                    <div style="font-weight:600; font-size:15px; margin-bottom:4px;">
                        ${c.name} 
                        <span class="cat-badge ${badgeClass}">${c.category}</span>
                    </div>
                    <div style="font-size:13px; color:var(--text-muted);">${c.address||'-'}</div>
                </div>
                <div style="display:flex; flex-direction:column; align-items:flex-end; gap:4px;">
                    <div style="font-size:11px; font-weight:600; color:var(--text-muted); padding:2px 6px; background:#F3F4F6; border-radius:4px;">${c.route||'Keine Tour'}</div>

            </div>`;
        }).join('') || '<div style="padding:30px; text-align:center; color:var(--text-muted);">Keine Ergebnisse</div>';
    }

    // --- 8. LOGIC: CUSTOMER ACTIONS ---
    function saveDetail(id){
        const c = db.customers.find(x => x.id === id);
        c.nextAppointment = document.getElementById('nextAppt').value;
        c.visitInterval = parseInt(document.getElementById('visitInt').value) || 4;
        const rev = document.getElementById('det-revenue');
        if(rev) c.products = rev.value;
        save();
    }

    function addTask(id) { 
        const t = document.getElementById('newT').value; 
        const d = document.getElementById('newTDate').value; 
        if(!t) return; 
        db.customers.find(x => x.id === id).tasks.push({text:t, done:false, dueDate:d}); 
        save(); showDetail(id); 
    }
    
    function toggleTask(id, idx) { 
        const t = db.customers.find(x => x.id === id).tasks[idx]; 
        t.done = !t.done; save(); showDetail(id); 
    }
    
    function delTask(id, idx) { 
        db.customers.find(x => x.id === id).tasks.splice(idx,1); 
        save(); showDetail(id); 
    }

    function addRep(id) { 
        const t = document.getElementById('repTxt').value; 
        const dInput = document.getElementById('repDate').value; 
        const f = document.getElementById('repImg').files[0]; 
        
        if(!t && !f) return; 
        
        let dateStr = new Date().toLocaleDateString('de-DE'); 
        if(dInput) { 
            const [y,m,d] = dInput.split('-'); 
            dateStr = `${d}.${m}.${y}`; 
        } 
        
        const saveReport = (img) => { 
            db.customers.find(x => x.id === id).reports.unshift({date:dateStr, text:t, img:img}); 
            save(); showDetail(id); 
        }; 
        
        if(f){ 
            const r = new FileReader(); 
            r.onload = e => { 
                const i = new Image(); 
                i.onload = () => { 
                    const cvs = document.createElement('canvas'); 
                    const x = cvs.getContext('2d'); 
                    const s = 800/i.width; // Better quality
                    cvs.width = 800; cvs.height = i.height*s; 
                    x.drawImage(i,0,0,cvs.width,cvs.height); 
                    saveReport(cvs.toDataURL('image/jpeg',0.7)); 
                }; 
                i.src = e.target.result; 
            }; 
            r.readAsDataURL(f); 
        } else { saveReport(null); } 
    }
    
    function editRep(cid, rid) { 
        const c = db.customers.find(x => x.id === cid); 
        const r = c.reports[rid]; 
        const newTxt = prompt("Text bearbeiten:", r.text); 
        if(newTxt !== null) { 
            const newDate = prompt("Datum (TT.MM.JJJJ):", r.date); 
            if(newDate) { r.text = newTxt; r.date = newDate; save(); showDetail(cid); } 
        } 
    }
    
    function delRep(cid, rid) {
        if(confirm("Bericht löschen?")) {
            db.customers.find(x => x.id === cid).reports.splice(rid, 1);
            save(); showDetail(cid);
        }
    }

    function togTour(id){
        if(db.tour.includes(id)) db.tour = db.tour.filter(x => x !== id);
        else db.tour.push(id);
        save(); showDetail(id);
    }
    
    function showForm(id=null){
        const c = id ? db.customers.find(x => x.id === id) : {name:'',nr:'',category:'C',status:'aktiv',address:'',contact:'',phone:'',email:'',route:'',products:''};

            <div class="card">

                <input id="f_name" value="${c.name}" style="font-weight:bold; font-size:16px;">

                    <div><label>Kundennummer</label><input id="f_nr" value="${c.nr||''}"></div>

                            <option value="A" ${c.category==='A'?'selected':''}>A (Gold)</option>
                            <option value="B" ${c.category==='B'?'selected':''}>B (Blau)</option>
                            <option value="C" ${c.category==='C'?'selected':''}>C (Grau)</option>
                        </select>
                    </div>
                    <div>
                        <label>Status</label>
                        <select id="f_stat">
                            <option value="aktiv" ${c.status==='aktiv'?'selected':''}>Aktiv</option>
                            <option value="inaktiv" ${c.status==='inaktiv'?'selected':''}>Inaktiv</option>
                        </select>
                    </div>
                </div>

                <label>Adresse</label>
                <input id="f_adr" value="${c.address||''}" placeholder="Straße, PLZ, Ort">
                
                <div class="grid-2">
                    <div><label>Ansprechpartner</label><input id="f_con" value="${c.contact||''}"></div>

                <label>E-Mail</label>

                <div style="margin-top:20px;">
                    <button class="btn btn-primary btn-full" onclick="saveData(${id})">Speichern</button>

                </div>

    function saveData(id){
        const n = document.getElementById('f_name').value;
        if(!n) return alert("Bitte Namen eingeben");
        
        const d = {
            id: id || Date.now(),
            name: n,
            nr: document.getElementById('f_nr').value,
            route: document.getElementById('f_route').value,
            category: document.getElementById('f_cat').value,
            status: document.getElementById('f_stat').value,
            address: document.getElementById('f_adr').value,
            contact: document.getElementById('f_con').value,
            phone: document.getElementById('f_tel').value,
            email: document.getElementById('f_mail').value,
            products: document.getElementById('f_prod').value,
            // Keep existing data if editing
            nextAppointment: id ? db.customers.find(x => x.id === id).nextAppointment : '',
            reports: id ? db.customers.find(x => x.id === id).reports : [],
            visitInterval: id ? (db.customers.find(x => x.id === id).visitInterval || 4) : 4, 
            tasks: id ? db.customers.find(x => x.id === id).tasks : []
        };
        
        if(id) db.customers[db.customers.findIndex(x => x.id === id)] = d;
        else db.customers.push(d);
        
        save(); 
        showDetail(d.id);
    }
    
    function delData(id){
        if(confirm("Kunden unwiderruflich löschen?")){
            db.customers = db.customers.filter(x => x.id !== id);
            db.tour = db.tour.filter(x => x !== id);
            save(); showCustomers();
        }
    }

    function toggleSelectMode(){ selectMode = !selectMode; selectedIds.clear(); showCustomers(); }
    function toggleSelection(id){ if(selectedIds.has(id)) selectedIds.delete(id); else selectedIds.add(id); showCustomers(); }
    
    function addBatchToTour(){
        if(selectedIds.size === 0) return alert("Keine Kunden ausgewählt.");
        selectedIds.forEach(id => { if(!db.tour.includes(id)) db.tour.push(id); });
        save(); selectMode = false; selectedIds.clear(); showTour();
    }
    
    function deleteBatch() { 
        if(selectedIds.size === 0) return alert("Keine Kunden ausgewählt.");
        if(!confirm(`${selectedIds.size} Kunden löschen?`)) return; 
        db.customers = db.customers.filter(c => !selectedIds.has(c.id)); 
        db.tour = db.tour.filter(id => !selectedIds.has(id)); 
        save(); selectMode = false; selectedIds.clear(); showCustomers(); 
    }
    
    function deleteCustomerDirect(e, id) { 
        e.stopPropagation(); 
        if(confirm("Löschen?")) { 
            db.customers = db.customers.filter(x => x.id !== id); 
            db.tour = db.tour.filter(x => x !== id); 
            save(); renderTable(); 
        } 
    }

        const list = db.expenses.sort((a,b) => {
            if(!a.date||!b.date) return 0;
            return b.date.split('.').reverse().join('').localeCompare(a.date.split('.').reverse().join(''));
        }).map(e => `

    // OCR Logic (Keep as is but clean)
    async function processOCR(input) {
        const file = input.files[0]; if(!file) return;
        const status = document.getElementById('ocrStatus');
        status.innerText = "Beleg wird analysiert...";
        
        const reader = new FileReader();
        reader.onload = e => {
            const preview = document.getElementById('ocr-preview');
            preview.src = e.target.result; preview.style.display = 'block';
            window.currentOcrImage = e.target.result;
        };
        reader.readAsDataURL(file);
        
        try {
            const worker = await Tesseract.createWorker('deu');
            const ret = await worker.recognize(file);
            const text = ret.data.text;
            const lines = ret.data.lines.map(l => l.text.trim()).filter(l => l.length > 2);
            
            if(lines.length > 0) document.getElementById('exp-note').value = lines[0];

            // Regex for Date
            const dateMatch = text.match(/(\d{2})[\.\/-](\d{2})[\.\/-](\d{2,4})/);
            if(dateMatch) {
                let y = dateMatch[3]; if(y.length === 2) y = "20" + y;
                document.getElementById('exp-date').value = `${y}-${dateMatch[2]}-${dateMatch[1]}`;
            }

            // Simple Amount Finder
            let maxVal = 0.0;
            const currentYear = new Date().getFullYear();
            lines.forEach(l => {
                const numbers = l.match(/[0-9]+[,.][0-9]{2}\b/g);
                if(numbers) {
                    numbers.forEach(numStr => {
                        let clean = numStr.replace(/\./g, 'X').replace(/,/g, '.').replace(/X/g, ''); 
                        if(numStr.includes(';')) clean = numStr.replace(/\./g, '').replace(',', '.');
                        const val = parseFloat(clean);
                        if(!isNaN(val) && (val < currentYear-1 || val > currentYear+1)) {
                            if(val > maxVal) maxVal = val;
                        }
                    });
                }
            });
            if(maxVal > 0) document.getElementById('exp-amount').value = maxVal.toFixed(2);

            // Category Guesser
            const t = text.toLowerCase();
            const cat = document.getElementById('exp-cat');
            if(t.includes('tank') || t.includes('liter') || t.includes('diesel') || t.includes('shell') || t.includes('aral')) cat.value = 'Tanken';
            else if(t.includes('park')) cat.value = 'Parken';
            else if(t.includes('hotel')) cat.value = 'Hotel';
            else if(t.includes('essen') || t.includes('burger') || t.includes('mcdonald')) cat.value = 'Verpflegung';
            
            status.innerText = "Scan abgeschlossen!";
            await worker.terminate();
        } catch(e) { status.innerText = "Fehler: " + e.message; }
    }

    function addExpense(){
        const dateIn = document.getElementById('exp-date').value;
        const amount = document.getElementById('exp-amount').value;
        const cat = document.getElementById('exp-cat').value;
        const note = document.getElementById('exp-note').value;
        const file = document.getElementById('exp-img').files[0];
        
        if(!dateIn || !amount) return alert("Pflichtfelder fehlen.");
        const [y,m,d] = dateIn.split('-');
        const dateStr = `${d}.${m}.${y}`;
        
        const saveExp = (imgData) => {
            if(editingExpenseId) {
                const e = db.expenses.find(x => x.id === editingExpenseId);
                e.date = dateStr; e.amount = amount; e.category = cat; e.note = note;
                if(imgData) e.img = imgData; 
                editingExpenseId = null;
            } else {
                db.expenses.unshift({id:Date.now(), date:dateStr, amount:amount, category:cat, note:note, img:imgData});
            }
            save(); showExpenses(); 
        };
        
        if(file){
            const r = new FileReader();
            r.onload = e => {
                const img = new Image();
                img.onload = () => {
                    const cvs = document.createElement('canvas'); const ctx = cvs.getContext('2d');
                    const scale = 800/img.width; cvs.width = 800; cvs.height = img.height*scale;
                    ctx.drawImage(img,0,0,cvs.width,cvs.height);
                    saveExp(cvs.toDataURL('image/jpeg',0.5));
                }; img.src = e.target.result;
            }; r.readAsDataURL(file);
        } else if (window.currentOcrImage) {
            saveExp(window.currentOcrImage);
        } else { saveExp(null); }
    }

    async function batchGeocode(){
        const missing = db.customers.filter(c => !c.lat && c.address.length > 5);
        if(missing.length === 0) return alert("Alles aktuell.");
        if(!confirm(`${missing.length} Adressen geocodieren?`)) return;
        
        document.getElementById('loader').style.display = 'flex';
        document.getElementById('stopGeoBtn').style.display = 'block';
        stopGeocoding = false;
        
        for(let i=0; i<missing.length; i++){
            if(stopGeocoding) break;
            const c = missing[i];
            document.getElementById('loader-text').innerText = `Verarbeite ${i+1} von ${missing.length}: ${c.name}`;
            try {
                const r = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(c.address)}`);
                const d = await r.json();
                if(d && d[0]) { c.lat = d[0].lat; c.lon = d[0].lon; }
            } catch(e) {}
            await new Promise(r => setTimeout(r, 1100)); // Rate Limit respect
        }
        save();
        document.getElementById('loader').style.display = 'none';
        showMap();
    }

    async function optTour(){
        if(!db.home || db.tour.length < 2) return alert("Benötige Startadresse und mind. 2 Kunden.");
        document.getElementById('loader').style.display = 'flex';
        
        const getC = async(a) => {
            try {
                const r = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(a)}`);
                const d = await r.json(); return d[0] ? {lat:d[0].lat, lon:d[0].lon} : null;
            } catch(e){ return null; }
        };
        
        const start = await getC(db.home);
        if(!start) { document.getElementById('loader').style.display='none'; return alert("Startadresse nicht gefunden."); }
        
        let pts = [];
        for(let id of db.tour){
            const c = db.customers.find(x => x.id === id);
            const co = await getC(c.address);
            if(co) pts.push({id, co});
        }
        
        // Nearest Neighbor
        let sorted = [], cur = start;
        while(pts.length){
            pts.sort((a,b) => {
                const dA = Math.pow(a.co.lat-cur.lat,2) + Math.pow(a.co.lon-cur.lon,2);
                const dB = Math.pow(b.co.lat-cur.lat,2) + Math.pow(b.co.lon-cur.lon,2);
                return dA - dB;
            });
            const n = pts.shift();
            sorted.push(n.id);
            cur = n.co;
        }
        
        db.tour = sorted; save();
        document.getElementById('loader').style.display = 'none';
        showTour();
    }

    function renderMonth(con){
        const y=currentCalDate.getFullYear(), m=currentCalDate.getMonth();
        const d=new Date(y,m+1,0).getDate();
        const off=(new Date(y,m,1).getDay()+6)%7;
        let h=`<div class="calendar-grid">`;
        ['Mo','Di','Mi','Do','Fr','Sa','So'].forEach(x=>h+=`<div class="cal-head" style="text-align:center; padding:10px; background:#F3F4F6; font-weight:bold; font-size:12px; color:#666;">${x}</div>`);
        for(let i=0;i<off;i++) h+=`<div style="background:#f9f9f9;"></div>`;
        for(let i=1;i<=d;i++){
            const ds=`${y}-${String(m+1).padStart(2,'0')}-${String(i).padStart(2,'0')}`;
            const isToday = new Date().toISOString().slice(0,10) === ds;
            h+=`<div class="cal-day ${isToday?'today':''}" ondragover="event.preventDefault()" ondrop="drop(event,'${ds}')">
                <div style="font-weight:bold; font-size:12px; margin-bottom:4px; ${isToday?'color:var(--primary);':''}">${i}</div>
                ${getEvts(ds)}
            </div>`;
        }
        con.innerHTML=h+`</div>`;
    }
    
    function renderDay(con){
        let h=`<div style="overflow-y:auto; height:100%;">`;
        const ds=currentCalDate.toISOString().slice(0,10);
        for(let i=7;i<=19;i++){

            h+=`<div style="display:flex; border-bottom:1px solid #eee; min-height:80px;" ondragover="event.preventDefault()" ondrop="dropTime(event,'${ds}','${t}')">

                <div style="flex:1; padding:8px;">${getEvts(ds,t)}</div>
            </div>`;
        }
        con.innerHTML=h+`</div>`;
    }
    
    function renderWeek(con){
        const d=new Date(currentCalDate);
        const mon=new Date(d.setDate(d.getDate()-((d.getDay()+6)%7)));
        let h=`<div style="overflow-y:auto; height:100%; display:grid; grid-template-rows: repeat(7, minmax(100px, 1fr));">`;
        for(let i=0;i<7;i++){
            const c=new Date(mon); c.setDate(mon.getDate()+i);

            h+=`<div style="padding:12px; border-bottom:1px solid #eee; display:flex; gap:12px;" ondragover="event.preventDefault()" ondrop="drop(event,'${ds}')">

                <div style="flex:1;">${getEvts(ds)}</div>
            </div>`;
        }
        con.innerHTML=h+`</div>`;
    }

            .map(c => `
                <div class="pool-item" draggable="true" ondragstart="dragId=${c.id}" style="padding:10px; margin-bottom:8px; background:white; border:1px solid #eee; border-radius:6px; cursor:grab; font-size:13px; display:flex; align-items:center;">
                    <span class="cat-badge cat-${c.category}" style="margin-right:8px; width:8px; height:8px; padding:0; min-width:8px;"></span>
                    ${c.name}
                </div>`)
            .join('');
    }

    function changeCal(d){
        if(calView==='month') currentCalDate.setMonth(currentCalDate.getMonth()+d);
        else if(calView==='day') currentCalDate.setDate(currentCalDate.getDate()+d);
        else if(calView==='week') currentCalDate.setDate(currentCalDate.getDate()+(d*7));
        else currentCalDate.setFullYear(currentCalDate.getFullYear()+d);
        showCalendar();
    }

    function drop(ev,ds){ ev.preventDefault(); dragTargetDate = ds; document.getElementById('timeModal').style.display='flex'; }
    function dropTime(ev,ds,t){ ev.preventDefault(); db.customers.find(x => x.id === dragId).nextAppointment = ds+'T'+t; save(); showCalendar(); }
    function confirmDrop(){ db.customers.find(x => x.id === dragId).nextAppointment = dragTargetDate+'T'+document.getElementById('modalTime').value; save(); closeModal(); showCalendar(); }
    function closeModal(){ document.getElementById('timeModal').style.display='none'; }
    function delAppt(id){ if(confirm("Termin entfernen?")){ db.customers.find(x => x.id === id).nextAppointment = ""; save(); showCalendar(); } }

    function getEvts(ds, t) {
        let html = db.customers.filter(c => {
            if(!c.nextAppointment || !c.nextAppointment.startsWith(ds)) return false;
            if(!t) return true;
            return c.nextAppointment.includes(t);
        }).map(c => `
            <div class="cal-event" draggable="true" ondragstart="dragId=${c.id}">
                <span onclick="showDetail(${c.id})">${c.nextAppointment.split('T')[1]} ${c.name}</span>
                <span style="margin-left:5px; opacity:0.7;" onclick="delAppt(${c.id})">×</span>
            </div>`
        ).join('');
        
        // Manual Events
        if(db.events) {
            html += db.events.filter(e => {
                if(!e.start.startsWith(ds)) return false;
                if(!t) return true;
                const slotH = parseInt(t.split(':')[0]);
                const startH = parseInt(e.start.split('T')[1].split(':')[0]);
                return startH === slotH;
            }).map(e => `
                <div class="cal-event manual" onclick="alert('${e.title}')">
                    ${e.start.split('T')[1]} ${e.title}
                </div>`
            ).join('');
        }
        return html;
    }

    // Helpers for Reports/Status
    function getStatus(c){
        if(!c.reports || c.reports.length === 0) return 'red';
        const lastRep = c.reports[0].date;
        const [d,m,y] = lastRep.split('.');
        const lastDate = new Date(y,m-1,d);
        const diffDays = (new Date() - lastDate)/(1000*60*60*24);
        const intervalDays = (c.visitInterval || 4)*7;
        
        if(diffDays > intervalDays) return 'red';
        if(diffDays > intervalDays - 7) return 'yellow';
        return 'green';
    }

    function showDuplicates() {
        const groups = {};
        db.customers.forEach(c => {
            const key = (c.address || '').toLowerCase().replace(/[^a-z0-9]/g, '');
            if (!key) return; 
            if (!groups[key]) groups[key] = [];
            groups[key].push(c);
        });
        const duplicates = Object.values(groups).filter(g => g.length > 1);
        
        if (duplicates.length === 0) return alert("Keine Duplikate gefunden.");
        
        let html = `<h1>Gefundene Duplikate</h1>`;
        duplicates.forEach(group => {
            html += `<div class="card" style="border-left:4px solid var(--danger);">
                <h3>📍 ${group[0].address}</h3>
                ${group.map(c => `
                    <div style="display:flex; justify-content:space-between; padding:10px; border-top:1px solid #eee;">
                        <div><b>${c.name}</b> (ID: ${c.id})</div>
                        <button class="btn btn-danger" style="padding:4px 8px; font-size:12px;" onclick="deleteCustomerDirect(event, ${c.id})">Löschen</button>
                    </div>`).join('')}
            </div>`;
        });
        document.getElementById('content').innerHTML = `<div style="margin-bottom:20px;"><button class="btn btn-secondary" onclick="showHome()">Zurück</button></div>` + html;
    }

    // PDF Report
    function generateReportPDF(range){
        const today = new Date();
        const dateStr = today.toLocaleDateString('de-DE');
        let data = [];

        db.customers.forEach(c => {
            (c.reports||[]).forEach(r => {
                const parts = r.date.split('.');
                if(parts.length === 3){
                    const repDate = new Date(parts[2], parts[1]-1, parts[0]);
                    let include = false;
                    if(range === 'day' && r.date === dateStr) include = true;
                    if(range === 'week') {
                        const diff = (today - repDate)/(1000*60*60*24);
                        if(diff <= 7 && diff >= 0) include = true;
                    }
                    if(include) data.push({...r, cName: c.name, rawDate: repDate});
                }
            });
        });

        if(data.length === 0) return alert("Keine Berichte im Zeitraum.");
        data.sort((a,b) => a.rawDate - b.rawDate);

        let html = `<div class="no-print" style="margin-bottom:20px;"><button class="btn btn-primary" onclick="window.print()">Drucken</button> <button class="btn btn-secondary" onclick="showHome()">Zurück</button></div>
        <h1>Bericht: ${range==='day'?'Heute':'Letzte 7 Tage'}</h1>`;
        
        data.forEach(r => {
            html += `<div class="card" style="page-break-inside:avoid;">
                <h3>${r.cName}</h3>
                <div style="color:#666; font-size:12px; margin-bottom:10px;">Datum: ${r.date}</div>
                <div style="white-space:pre-wrap;">${r.text}</div>
                ${r.img ? `<img src="${r.img}" style="max-width:300px; margin-top:15px; border:1px solid #eee;">` : ''}
            </div>`;
        });
        document.getElementById('content').innerHTML = html;
    }
    
    // Manual Events Placeholders (UI logic is in modal)
    function openEventModal() { document.getElementById('eventModal').style.display='flex'; }
    function saveManualEvent() { alert("Funktion in Arbeit (Clean Code Placeholder)"); document.getElementById('eventModal').style.display='none'; }
    function delManualEvent() {}

</script>
