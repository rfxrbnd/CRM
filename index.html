<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CRM – Komplettversion</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js" defer></script>

<style>
:root{--primary:#2563eb;--bg:#f3f4f6;--surface:#fff;--border:#e5e7eb;--text:#111827;--muted:#6b7280;--danger:#dc2626;--radius:8px}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui;background:var(--bg);display:flex;height:100vh}
aside{width:240px;background:var(--surface);border-right:1px solid var(--border);padding:16px}
nav button{all:unset;display:block;padding:10px;border-radius:var(--radius);cursor:pointer}
nav button.active,nav button:hover{background:var(--primary);color:#fff}
main{flex:1;padding:24px;overflow:auto}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:16px}
input,select,button{padding:8px;border-radius:var(--radius);border:1px solid var(--border)}
button.primary{background:var(--primary);color:#fff;border:none}
button.danger{background:var(--danger);color:#fff;border:none}
table{width:100%;border-collapse:collapse}th,td{padding:8px;border-bottom:1px solid var(--border)}
</style>
</head>
<body>

<aside>
<h2>CRM</h2>
<nav>
<button class="active" data-view="dashboard">Dashboard</button>
<button data-view="customers">Kunden</button>
<button data-view="calendar">Kalender</button>
<button data-view="expenses">Spesen</button>
<button data-view="map">Karte</button>
<button data-view="reports">PDF</button>
</nav>
</aside>

<main id="content"></main>

<script>
'use strict';
const DB_KEY='crm_full_db';
let db={customers:[],expenses:[],events:[]};

/* INIT */
document.addEventListener('DOMContentLoaded',()=>{load();bindNav();showDashboard();});
function load(){const r=localStorage.getItem(DB_KEY);if(r)db=JSON.parse(r)}
function save(){localStorage.setItem(DB_KEY,JSON.stringify(db))}
function bindNav(){document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');route(b.dataset.view)})}
function route(v){({customers:showCustomers,calendar:showCalendar,expenses:showExpenses,map:showMap,reports:showReports}[v]||showDashboard)()}

/* DASHBOARD */
function showDashboard(){content.innerHTML=`<div class=card><h2>Übersicht</h2><p>Kunden: <b>${db.customers.length}</b></p><p>Termine: <b>${db.events.length}</b></p><p>Spesen: <b>${db.expenses.length}</b></p></div>`}

/* CUSTOMERS + CSV */
function showCustomers(){const rows=db.customers.map((c,i)=>`<tr><td>${c.name}</td><td>${c.address}</td><td><button class=danger onclick=delCustomer(${i})>X</button></td></tr>`).join('');
content.innerHTML=`<div class=card><h3>Kunde</h3><input id=cname placeholder=Name><input id=caddr placeholder=Adresse><button class=primary onclick=addCustomer()>Speichern</button></div>
<div class=card><button onclick=exportCSV()>CSV Export</button><input type=file onchange=importCSV(this)></div>
<div class=card><table><tr><th>Name</th><th>Adresse</th><th></th></tr>${rows}</table></div>`}
function addCustomer(){const n=cname.value.trim();if(!n)return alert('Name fehlt');db.customers.push({name:n,address:caddr.value});save();showCustomers()}
function delCustomer(i){if(confirm('Löschen?')){db.customers.splice(i,1);save();showCustomers()}}
function exportCSV(){let csv='name,address\n';db.customers.forEach(c=>csv+=`"${c.name}","${c.address}"\n`);download(csv,'customers.csv')}
function importCSV(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=e=>{e.target.result.split(/\r?\n/).slice(1).forEach(l=>{const[p,a]=l.split(',');if(p)db.customers.push({name:p.replace(/"/g,''),address:(a||'').replace(/"/g,'')})});save();showCustomers()};r.readAsText(f)}

/* CALENDAR */
function showCalendar(){const rows=db.events.map((e,i)=>`<tr><td>${e.date}</td><td>${e.title}</td><td><button class=danger onclick=delEvent(${i})>X</button></td></tr>`).join('');
content.innerHTML=`<div class=card><h3>Termin</h3><input id=edate type=date><input id=etitle placeholder=Titel><button class=primary onclick=addEvent()>Speichern</button></div>
<div class=card><table><tr><th>Datum</th><th>Titel</th><th></th></tr>${rows}</table></div>`}
function addEvent(){if(!edate.value)return;db.events.push({date:edate.value,title:etitle.value});save();showCalendar()}
function delEvent(i){db.events.splice(i,1);save();showCalendar()}

/* EXPENSES + OCR */
function showExpenses(){const rows=db.expenses.map(e=>`<tr><td>${e.date}</td><td>${e.note}</td><td>${e.amount} €</td></tr>`).join('');
content.innerHTML=`<div class=card><h3>Spese</h3><input id=enote placeholder=Text><input id=eamount type=number placeholder=Betrag><input type=file accept=image/* onchange=ocr(this)><button class=primary onclick=addExpense()>Speichern</button></div>
<div class=card><table><tr><th>Datum</th><th>Text</th><th>Betrag</th></tr>${rows}</table></div>`}
function addExpense(){if(!eamount.value)return;db.expenses.push({date:new Date().toLocaleDateString(),note:enote.value,amount:eamount.value});save();showExpenses()}
async function ocr(inp){const f=inp.files[0];if(!f)return;const w=await Tesseract.createWorker('deu');const r=await w.recognize(f);enote.value=r.data.text.split('\n')[0]||'';await w.terminate()}

/* MAP */
function showMap(){content.innerHTML='<div class=card><div id=map style="height:500px"></div></div>';
setTimeout(()=>{const m=L.map('map').setView([51.1657,10.4515],6);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(m);db.customers.forEach(c=>{if(c.address)fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(c.address)}`).then(r=>r.json()).then(d=>{if(d[0])L.marker([d[0].lat,d[0].lon]).addTo(m).bindPopup(c.name)})})},0)}

/* PDF */
function showReports(){content.innerHTML='<div class=card><button class=primary onclick=pdf()>PDF erzeugen</button></div>'}
function pdf(){const {jsPDF}=window.jspdf;const p=new jsPDF();p.text('CRM Bericht',10,10);db.customers.forEach((c,i)=>p.text(`${c.name} – ${c.address}`,10,20+i*8));p.save('crm.pdf')}

function download(t,n){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t]));a.download=n;a.click()}
</script>
</body>
</html>
