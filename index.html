<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CRM</title>
  <style>
    :root {
      --bg-body:#f3f4f6; --bg-sidebar:#fff; --surface:#fff;
      --text-main:#111827; --text-light:#6b7280; --border:#e5e7eb;
      --radius:10px; --shadow:0 4px 6px -1px rgba(0,0,0,.06);
    }
    *{box-sizing:border-box;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto}
    body{margin:0;background:var(--bg-body);color:var(--text-main)}
    .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:15px}
    .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:15px}
    @media(max-width:800px){.grid-2{grid-template-columns:1fr}}
    .btn{padding:8px 12px;border-radius:8px;border:1px solid var(--border);background:#fff;cursor:pointer}
    .btn-primary{background:#111827;color:#fff}
    .btn-full{width:100%}
    .report-entry{padding:10px;border:1px solid var(--border);border-radius:8px;background:#f9fafb;margin-bottom:6px}
    .report-entry:hover{border-color:#9ca3af}
    textarea,input{width:100%;padding:6px;border:1px solid var(--border);border-radius:6px}
  </style>
</head>
<body>
<div id="content"></div>

<script>
const DB_KEY='crm_demo';
let db=JSON.parse(localStorage.getItem(DB_KEY)||'{"customers":[]}');
function save(){localStorage.setItem(DB_KEY,JSON.stringify(db));}

function showCustomers(){
  document.getElementById('content').innerHTML=`<div class="card"><h2>Kunden</h2>${db.customers.map(c=>`<div onclick=\"showDetail(${c.id})\" style=\"cursor:pointer;padding:6px 0\">${c.name}</div>`).join('')}</div>`;
}

function showDetail(id){
  const c=db.customers.find(x=>x.id===id); if(!c) return;
  const reports=(c.reports||[]).map((r,i)=>`<div class="report-entry"><b>${r.date}</b><div>${r.text}</div><div><span onclick=\"delRep(${id},${i})\" style=\"cursor:pointer\">🗑️</span></div></div>`).join('');
  const reportsHTML=reports||'<div style="color:#999">Keine Berichte</div>';

  document.getElementById('content').innerHTML=`
    <button class="btn" onclick="showCustomers()">← Zurück</button>
    <h1>${c.name}</h1>
    <div class="grid-2">
      <div class="card">
        <h3>Besuchsbericht</h3>
        <input type="date" id="repDate" value="${new Date().toISOString().split('T')[0]}">
        <textarea id="repTxt" rows="4"></textarea>
        <button class="btn btn-primary btn-full" onclick="addRep(${id})">Speichern</button>
      </div>
      <div class="card"><h3>Berichte</h3>${reportsHTML}</div>
    </div>`;
}

function addRep(id){
  const c=db.customers.find(x=>x.id===id);
  if(!c.reports)c.reports=[];
  c.reports.push({date:repDate.value,text:repTxt.value});
  save(); showDetail(id);
}
function delRep(cid,rid){
  const c=db.customers.find(x=>x.id===cid);
  c.reports.splice(rid,1); save(); showDetail(cid);
}

// Demo
if(db.customers.length===0){db.customers.push({id:1,name:'Musterkunde',reports:[]});save();}
showCustomers();
</script>
</body>
</html>
